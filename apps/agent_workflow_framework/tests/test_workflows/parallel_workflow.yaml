name: parallel_workflow
description: Parallel fan-out / fan-in DAG workflow testing concurrent step execution
steps:
  - id: step_root
    action: echo
    params:
      seed: 100
      status: "initialized"
    depends_on: []
    retry: 0

  - id: step_branch_a
    action: transform
    params:
      base: "${steps.step_root.output.seed}"
      multiplier: 2
    depends_on:
      - step_root
    retry: 0

  - id: step_branch_b
    action: transform
    params:
      base: "${steps.step_root.output.seed}"
      adder: 50
    depends_on:
      - step_root
    retry: 0

  - id: step_join
    action: transform
    params:
      val_a: "${steps.step_branch_a.output.result}"
      val_b: "${steps.step_branch_b.output.result}"
      operation: "sum"
    depends_on:
      - step_branch_a
      - step_branch_b
    retry: 0
