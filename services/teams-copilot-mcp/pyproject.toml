[project]
name = "teams-copilot-mcp"
version = "0.1.0"
description = "MCP server exposing Microsoft Teams (Graph API) and M365 Copilot operations as tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
teams-copilot-mcp = "teams_copilot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_copilot_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
