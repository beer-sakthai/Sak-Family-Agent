[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sak-mcp-gateway"
version = "1.0.0"
description = "Sak Family Model Context Protocol (MCP) Gateway for Microsoft 365 Copilot & Work IQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sak_mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
