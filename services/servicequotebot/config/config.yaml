# ServiceQuoteBot Production Configuration
model:
  provider: huggingface
  default: deepseek-ai/DeepSeek-V4.1-Flash
fallback_model:
  provider: ollama-cloud
  model: gpt-oss:120b
  base_url: https://ollama.com/v1
approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
command_allowlist: []
security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: false
  allow_lazy_installs: false
quoting:
  default_currency: USD
  max_discount_percent: 15
  require_contact_info: true
  lead_storage_kind: lead
  handoff_personas:
    - sakthai
    - saktan
