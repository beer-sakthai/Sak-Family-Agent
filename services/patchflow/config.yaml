name: patchflow
version: 1.0.0
enabled: true

engine:
  max_attempts_per_finding: 3
  auto_create_branch: true
  branch_prefix: "fix/patchflow-"
  line_length: 100

anti_gaming:
  token_ceiling_enabled: true
  max_tool_desc_tokens: 120
  max_param_desc_tokens: 50
  forbid_few_shot_stuffing: true
  paired_blind_judging: true
  human_approval_gate_required: true
  snapshot_rollback_enabled: true
  holdout_gate_required: true

pr:
  prefix: "fix(patchflow):"
  require_manual_merge: true
  auto_merge: false
