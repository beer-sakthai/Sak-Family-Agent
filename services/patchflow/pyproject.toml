[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchflow"
version = "0.1.0"
description = "PatchFlow - Automated Patching Engine MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
