# Enforce the repository security and quality skills on every pull request.
#
# This workflow deliberately holds only what nothing else covers. It used to
# carry a `quality` job (ruff check + ruff format + mypy + pytest at
# --cov-fail-under=96) and a bandit step, all of which ci.yml already runs — and
# runs across a 3.11/3.12 matrix rather than 3.11 alone, so this file's copy was
# a strict subset. Every PR paid for the suite twice, and the coverage floor had
# to be kept in step in three places at once.
#
# What is left is the work with no second home:
#   * skill-validation — `sakthai skills validate` and `make compose-personas`
#   * security         — zizmor over the workflows, and the tracked-secret check
name: Repository Security and Quality

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: repository-security-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  skill-validation:
    name: Validate repository skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate shared skill frontmatter
        run: uv run sakthai skills validate --source library

      - name: Compose persona skill trees
        run: make compose-personas

      - name: Remove generated composition output
        if: always()
        run: rm -rf build

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        # Hash-locked like bandit and pylint (see
        # .github/zizmor-requirements.in/.lock, regenerate with
        # scripts/gen_hash_lock.py). This step used to be `uvx zizmor`, which
        # resolves whatever version is newest at run time — an unpinned
        # dependency in the job whose entire purpose is checking that
        # dependencies are pinned.
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/zizmor-requirements.lock

      - name: Scan workflows for supply-chain and injection issues
        # Scans the whole directory. This used to name exactly one file --
        # `.github/workflows/repository-security-quality.yml`, i.e. itself --
        # so the repository's only workflow-security linter audited 1 of 26
        # workflows and never saw the other 25.
        #
        # Default persona, not --pedantic: see the rationale and the two
        # documented suppressions in .github/zizmor.yml.
        #
        # --no-online-audits keeps this gate deterministic. zizmor's online
        # audits call the GitHub API and abort the whole run on any failure
        # there ("error in 'artipacked' audit: couldn't list tags for
        # actions/checkout"), which would make a transient API blip look like a
        # security regression. Everything that found a real issue here --
        # dangerous-triggers, archived-uses, excessive-permissions,
        # template-injection -- resolves offline. Vulnerable-dependency coverage
        # comes from dependency-audit.yml and dependency-review.yml instead.
        run: zizmor --no-online-audits --config .github/zizmor.yml .github/workflows/

      - name: Check for tracked secret-like files
        run: |
          # Documented .env.example files are safe templates; reject actual
          # dotenv files and common private-key/credential filenames.
          forbidden='(^|/)(\.env$|.*\.(pem|key)$|id_rsa$|credentials\.json$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "Tracked secret-like files are not allowed."
            exit 1
          fi
