name: GitHub Workflow Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-workflows:
    name: Sync Workflows Across Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sync workflows
        uses: varunsridharan/action-github-workflow-sync@3c60cce5ee8e615a7c68ac75fc14893dcac62d49 # 3.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORIES: beer-sakthai/Sak-Family-Agent
          WORKFLOW_FILES: lint-check.yml
