# Retire code-scanning alerts left behind by a scanner that no longer runs.
#
# An alert is only ever closed by a newer analysis from the same tool that no
# longer reports it. When a scanning workflow is deleted, its alerts lose their
# producer and stay open on the Security tab forever — no commit, no PR and no
# other scanner can clear them. Deleting the orphaned analyses is the supported
# remedy. See docs/code-scanning-sweep-2026-08-12.md.
#
# This exists as a workflow because the permission required
# ("Code scanning alerts" / security_events) is one the repository's own
# GITHUB_TOKEN can be granted per job, so no personal access token is needed —
# run it from the Actions tab rather than minting a PAT.
#
# Manual only, and read-only unless asked otherwise: with no inputs it just
# reports what is on the dashboard. Deleting requires naming a tool *and*
# ticking `apply`.
name: Code scanning cleanup

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool whose analyses to delete, exactly as the report spells it. Leave blank to only list."
        required: false
        type: string
      apply:
        description: "Actually delete. Leave unchecked for a dry run."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    name: Code scanning cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reading alerts needs this, and deleting analyses needs it at write.
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Every input reaches the shell through the environment, never through
      # ${{ }} interpolation inside a run block — an input expanded into the
      # script text is a command-injection sink (actions/code-injection).
      - name: Report what is on the dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/code_scanning_analyses.py list --alerts

      # An alert that stops appearing under `open` has either been fixed by a
      # diff, dropped by a re-scoring scan, or dismissed as accepted risk, and
      # the open listing cannot tell those apart. `closed` covers dismissed and
      # fixed together and prints each alert's real state, which is what
      # separates them. The 2026-08-13 read lost 29 PinnedDependenciesID alerts
      # with no matching diff; a `dismissed`-only read showed zero Scorecard
      # alerts, which is what widened this step to `closed`.
      - name: Report what closed, and whether it was fixed or dismissed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/code_scanning_analyses.py list --alerts --state closed

      - name: Delete the named tool's analyses
        if: ${{ inputs.tool != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOOL: ${{ inputs.tool }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/code_scanning_analyses.py delete --tool "$TOOL" --apply
          else
            python scripts/code_scanning_analyses.py delete --tool "$TOOL"
          fi

      - name: Report what remains
        if: ${{ inputs.tool != '' && inputs.apply }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/code_scanning_analyses.py list
