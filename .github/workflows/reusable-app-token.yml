# Reusable GitHub App Installation Token Generator
# Exchanges a GitHub App ID and private key for an installation access token

name: Reusable App Token

on:
  workflow_call:
    inputs:
      repository:
        description: 'Target repository name to scope token access'
        required: false
        type: string
      permission_contents:
        description: 'Contents permission level'
        required: false
        default: 'read'
        type: string
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true
    outputs:
      token:
        description: 'The installation access token'
        value: ${{ jobs.token-generator.outputs.token }}

permissions:
  contents: read

concurrency:
  group: app-token-${{ github.ref }}
  cancel-in-progress: false

jobs:
  token-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          repositories: ${{ inputs.repository || github.event.repository.name || 'Sak-Family-Agent' }}
          permission-contents: ${{ inputs.permission_contents || 'read' }}
