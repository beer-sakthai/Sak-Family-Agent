# Reusable GitHub App Installation Token Generator
# Exchanges a GitHub App ID and private key for an installation access token

name: Reusable App Token

on:
  workflow_call:
    inputs:
      repository:
        description: 'Target repository name to scope token access'
        required: false
        type: string
      permission_contents:
        description: 'Contents permission level'
        required: false
        default: 'read'
        type: string
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true
    outputs:
      token:
        description: 'The installation access token'
        value: ${{ jobs.token-generator.outputs.token }}

permissions:
  contents: read

concurrency:
  group: app-token-${{ github.ref }}
  cancel-in-progress: false

jobs:
  token-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          repositories: ${{ inputs.repository || github.event.repository.name || 'Sak-Family-Agent' }}
          permission-contents: ${{ inputs.permission_contents || 'read' }}
