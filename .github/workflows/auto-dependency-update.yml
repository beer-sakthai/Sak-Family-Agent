name: Auto Dependency Update

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  schedule:
    # Runs at 08:00 UTC every Monday
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # All writes go through the explicit GH_PAT_FOR_ACTIONS token passed
          # to create-pull-request below; don't also persist a credential
          # helper for the default GITHUB_TOKEN.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Configure Git
        run: |
          git config user.name "SakJules [bot]"
          git config user.email "actions@github.com"

      - name: Create new branch
        id: branch
        run: |
          BRANCH_NAME="chore/deps-$(date +%Y-%m-%d)"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME

      - name: Upgrade dependencies
        id: upgrade
        run: |
          # `uv lock --upgrade` is the correct command for uv's project
          # lockfile: it re-resolves uv.lock (TOML) in place while honoring
          # pyproject.toml's constraints. `uv pip compile -o uv.lock` (the
          # previous command here) writes pip-compile's requirements.txt-style
          # output, which is a different format — it silently corrupted
          # uv.lock and broke every subsequent `uv sync` in this job.
          uv lock --upgrade
          # Check if the lockfile changed. If not, we can exit early.
          if git diff --quiet uv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No dependency changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dependencies upgraded. Proceeding to validation."
          fi

      - name: Validate changes
        # Mirror ci.yml's full quality gate, not just the test suite, so a
        # dependency bump that breaks lint/typing/security scanning never
        # reaches a human as an already-passing-looking PR.
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          uv sync --extra dev
          uv run ruff check personas/sakthai/sakthai tests
          uv run ruff format --check personas/sakthai/sakthai tests
          uv run mypy personas/sakthai/sakthai
          uv run bandit -c pyproject.toml -r personas/sakthai/sakthai
          uv run pytest tests/ -q -m "not integration"

      - name: Create Pull Request
        if: steps.upgrade.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A PAT is required to trigger the CI workflow.
          # The GITHUB_TOKEN will not trigger other workflows.
          token: ${{ secrets.GH_PAT_FOR_ACTIONS }}
          commit-message: "build: Automated dependency upgrade"
          title: "build: Automated Dependency Upgrade"
          # Opened as a draft requiring human review. Passing the test suite is
          # not sufficient to auto-merge a dependency bump: a newly published
          # malicious version can pass tests, so a person must review the diff
          # (and ideally the changelog) before merge. Do NOT enable auto-merge.
          draft: true
          labels: |
            dependencies
            needs-human-review
          body: |
            This PR was automatically generated by the SakJules agent. It contains the latest dependency versions that pass linting, type-checking, bandit, and the test suite locally.

            ⚠️ Review required before merge — auto-merge is intentionally disabled.
            Inspect the dependency diff (and changelogs) for supply-chain risk.
          branch: ${{ steps.branch.outputs.name }}
          base: main

      - name: Report no changes
        if: steps.upgrade.outputs.changed == 'false'
        run: echo "No new dependency versions found. Workflow complete."