name: Gemini Actions

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Gemini action mode to inspect or execute"
        required: false
        default: "info"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini:
    name: Run Gemini Actions Meta-Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute Gemini Actions Dispatcher
        uses: dortort/gemini-actions@c7ce09711c46a567055a16a762c0c99fdf181aeb # v0.1.0
        with:
          action: ${{ inputs.action_mode || 'info' }}
