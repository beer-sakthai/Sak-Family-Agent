name: Fixed Issues Labeler

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label-fixed:
    name: Label Fixed Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Label Fixed Issues
        uses: gh-bot/fix-labeler@82c1402f0c82ebadc301f508ab3f1f69184752d2 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: "fixed"
