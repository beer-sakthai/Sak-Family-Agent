# This workflow runs the agent with security-focused skills on a schedule to
# proactively find, triage, and propose fixes for vulnerabilities.
#
# This file is ACTIVE: it lives under .github/workflows/ and runs nightly.
# A stale duplicate previously sat at the repository root and was documented
# in docs/security-hardening.md as proof this workflow was dormant — that
# doc entry was wrong (this copy has been live since the workflow file first
# landed here) and has been corrected; the root-level duplicate was removed.
name: Continuous Security Scan

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  schedule:
    # Runs nightly at 2 AM UTC
    - cron: '0 2 * * *'

# Least privilege at the top level; the single job below widens only what it
# needs, so any job added later starts read-only rather than inheriting a
# repo-write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  devsecops-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The agent step cannot work without Anthropic credentials, and this
      # repository does not currently configure them — every nightly run failed
      # at "No Anthropic credentials found", so the workflow was permanently
      # red and told nobody anything. Resolve the presence check once here
      # (`secrets` is available in a job-level `env:` but not in a step-level
      # `if:`) and let the step skip cleanly instead of failing. Add the
      # ANTHROPIC_API_KEY secret and the scan starts running with no further
      # change to this file.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    # No job-level widening: the DevSecOps Skill step below overrides
    # GITHUB_TOKEN to GH_PAT_FOR_ACTIONS in its own env: block for any branch
    # push or PR it creates, and checkout sets persist-credentials: false — the
    # ambient GITHUB_TOKEN is never used for a write, so top-level contents:
    # read is all this job needs.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Configure Git User
        run: |
          git config --global user.name "SakKing Agent [bot]"
          git config --global user.email "sakking-agent[bot]@users.noreply.github.com"

      - name: Run DevSecOps Skill
        # This command invokes the agent and tells it to use security skills to
        # scan for issues and trigger the automated patching pipeline, which
        # may create a pull request with a proposed fix.
        #
        # --with-skills matches by exact skill name (sakthai/skills.py
        # resolve_skill_names) against SakThai's own skills dir + the shared
        # skills dir + library/ (see default_skill_roots() in skills.py) —
        # NOT other personas' skill directories. This repo has no skill
        # literally named "devsecops" anywhere in those roots (the only
        # devsecops-named skills live under personas/sakking/skills/ and
        # personas/sakjules/skills/, which sakthai run never searches), so the
        # old value silently failed to resolve. `sakthai run` only warns and
        # skips unresolved --with-skills names on a live run (--dry-run is the
        # one that fails hard), so this step was exiting 0 every night while
        # running the agent with no security-skill guidance injected at all.
        # Both skills below are verified to resolve from those roots via
        # `skills.collect_skills(*default_skill_roots())`:
        # sakthai-security-red-teaming ("audit system inputs, API sandboxes and
        # file capabilities to identify security vulnerabilities") and
        # sakthai-security-hardening (general hardening checklist), both from
        # library/security/.
        #
        # The previous value, SakThai-coding-security, does NOT exist in any
        # searched root — the comment here used to assert it did. That is the
        # same silent failure this comment was written to describe: a live run
        # only warns and skips an unresolved name, so the agent ran with half
        # the intended guidance and still exited 0. Verify with
        # `sakthai run --dry-run --with-skills <name>`, which fails hard on an
        # unresolved name, before changing either value.
        #
        # --max-seconds bounds a single nightly run so a stuck/looping agent
        # can't burn the full job timeout (or unbounded API spend).
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          uv run sakthai run "Perform a full security audit of the codebase — run static analysis, triage findings, and propose fixes." \
            --with-skills sakthai-security-red-teaming \
            --with-skills sakthai-security-hardening \
            --provider anthropic \
            --max-seconds 1800
        env:
          # API keys are needed for the LLM to generate patches.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A PAT is used instead of the default GITHUB_TOKEN to ensure that any
          # pull requests created by the agent will trigger the full CI suite.
          # This is a critical security and validation measure.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_ACTIONS }}
          # Scope shell execution to only the security tools the skill needs,
          # rather than "1" (which would allow ANY binary). Colon-separated
          # program allow-list, honored by sakthai's run_command tool.
          SAKTHAI_SHELL_ALLOW: "ruff:bandit:mypy:pytest:uv:git:python:python3"

      - name: Explain why the scan was skipped
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice title=DevSecOps scan skipped::ANTHROPIC_API_KEY is not configured on this repository, so the nightly agent scan cannot run. Add the secret to enable it; no other change to continuous-security.yml is needed."
