# This workflow runs the agent with security-focused skills on a schedule to
# proactively find, triage, and propose fixes for vulnerabilities.
#
# This file is ACTIVE: it lives under .github/workflows/ and runs nightly.
# A stale duplicate previously sat at the repository root and was documented
# in docs/security-hardening.md as proof this workflow was dormant — that
# doc entry was wrong (this copy has been live since the workflow file first
# landed here) and has been corrected; the root-level duplicate was removed.
name: Continuous Security Scan

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  schedule:
    # Runs nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: write # To create branches and commits for patches
  pull-requests: write # To create pull requests with fixes

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  devsecops-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Configure Git User
        run: |
          git config --global user.name "SakKing Agent [bot]"
          git config --global user.email "sakking-agent[bot]@users.noreply.github.com"

      - name: Run DevSecOps Skill
        # This command invokes the agent and tells it to use security skills to
        # scan for issues and trigger the automated patching pipeline, which
        # may create a pull request with a proposed fix.
        #
        # --with-skills matches by exact skill name (sakthai/skills.py
        # resolve_skill_names) against SakThai's own skills dir + the shared
        # skills dir + library/ (see default_skill_roots() in skills.py) —
        # NOT other personas' skill directories. This repo has no skill
        # literally named "devsecops" anywhere in those roots (the only
        # devsecops-named skills live under personas/sakking/skills/ and
        # personas/sakjules/skills/, which sakthai run never searches), so the
        # old value silently failed to resolve. `sakthai run` only warns and
        # skips unresolved --with-skills names on a live run (--dry-run is the
        # one that fails hard), so this step was exiting 0 every night while
        # running the agent with no security-skill guidance injected at all.
        # Using two skills that DO resolve from the searched roots and match
        # this task: SakThai-coding-security (this repo's own bandit/sandbox
        # posture) and sakthai-security-hardening (general hardening
        # checklist). --max-seconds bounds a single nightly run so a
        # stuck/looping agent can't burn the full job timeout (or unbounded
        # API spend).
        run: |
          uv run sakthai run "Perform a full security audit of the codebase — run static analysis, triage findings, and propose fixes." \
            --with-skills SakThai-coding-security \
            --with-skills sakthai-security-hardening \
            --provider anthropic \
            --max-seconds 1800
        env:
          # API keys are needed for the LLM to generate patches.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A PAT is used instead of the default GITHUB_TOKEN to ensure that any
          # pull requests created by the agent will trigger the full CI suite.
          # This is a critical security and validation measure.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_ACTIONS }}
          # Scope shell execution to only the security tools the skill needs,
          # rather than "1" (which would allow ANY binary). Colon-separated
          # program allow-list, honored by sakthai's run_command tool.
          SAKTHAI_SHELL_ALLOW: "ruff:bandit:mypy:pytest:uv:git:python:python3"