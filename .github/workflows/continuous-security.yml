# This workflow runs the agent with security-focused skills to proactively
# find, triage, and propose fixes for vulnerabilities.
#
# Manual only (Actions tab -> Run workflow). It ran nightly until 2026-10-13,
# but it needs an ANTHROPIC_API_KEY repository secret and every scheduled run
# since at least 2026-10-02 failed for want of one. Add the secret before
# running it, and restore the schedule only if the nightly API cost is wanted.
#
# This file is ACTIVE: it lives under .github/workflows/.
# A stale duplicate previously sat at the repository root and was documented
# in docs/security-hardening.md as proof this workflow was dormant — that
# doc entry was wrong (this copy has been live since the workflow file first
# landed here) and has been corrected; the root-level duplicate was removed.
name: Continuous Security Scan

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  devsecops-scan:
    runs-on: ubuntu-latest
    # Read-only on purpose. The agent audits and reports; it has no push
    # credential and no write scope, so a prompt injection in anything it
    # reads cannot turn into a commit, a branch or a pull request.
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run DevSecOps Skill
        # This command invokes the agent and tells it to use security skills to
        # scan for issues and report findings with proposed fixes in its output.
        # It does not push or open pull requests.
        #
        # --with-skills matches by exact skill name (sakthai/skills.py
        # resolve_skill_names) against SakThai's own skills dir + the shared
        # skills dir + library/ (see default_skill_roots() in skills.py) —
        # NOT other personas' skill directories. This repo has no skill
        # literally named "devsecops" anywhere in those roots (the only
        # devsecops-named skills live under personas/sakking/skills/ and
        # personas/sakjules/skills/, which sakthai run never searches), so the
        # old value silently failed to resolve. `sakthai run` only warns and
        # skips unresolved --with-skills names on a live run (--dry-run is the
        # one that fails hard), so this step was exiting 0 every night while
        # running the agent with no security-skill guidance injected at all.
        # Using two skills that DO resolve from the searched roots and match
        # this task: SakThai-coding-security (this repo's own bandit/sandbox
        # posture) and sakthai-security-hardening (general hardening
        # checklist). --max-seconds bounds a single nightly run so a
        # stuck/looping agent can't burn the full job timeout (or unbounded
        # API spend).
        run: |
          uv run sakthai run "Perform a full security audit of the codebase — run static analysis, triage findings, and propose fixes." \
            --with-skills SakThai-coding-security \
            --with-skills sakthai-security-hardening \
            --provider anthropic \
            --max-seconds 1800
        env:
          # The provider key is the only secret this step gets. run_command
          # withholds credential-named variables from the programs it starts,
          # so the allow-listed tools below never see it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Scope shell execution to the analysis tools the skills need, rather
          # than "1" (which would allow ANY binary). Colon-separated program
          # allow-list, honored by sakthai's run_command tool; `uv run` puts
          # .venv/bin on PATH, so these resolve to the locked versions.
          #
          # Deliberately absent: python, python3 and uv (each runs arbitrary
          # code by design) and git (`git -c core.pager=<cmd> log` and
          # `git -c alias.x='!<cmd>' x` run arbitrary commands, and the
          # guardrails only check git for sensitive-path arguments).
          SAKTHAI_SHELL_ALLOW: "ruff:bandit:mypy:pytest"
