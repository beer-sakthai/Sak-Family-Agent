name: Dependabot Lockfile Fixer

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-fixer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-lockfiles:
    runs-on: ubuntu-latest
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository)
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node (corepack + packageManager detection)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup bun (used if bun detected)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "latest"

      - name: Detect JavaScript project
        id: detect-project
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail
          project_dir=""
          while IFS= read -r changed_file; do
            case "$changed_file" in
              */package.json|*/package-lock.json|*/pnpm-lock.yaml|*/yarn.lock|*/bun.lockb|*/bun.lock)
                project_dir="${changed_file%/*}"
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")

          if [[ -n "$project_dir" && -f "$project_dir/package.json" ]]; then
            echo "working_directory=$project_dir" >> "$GITHUB_OUTPUT"
            echo "has_project=true" >> "$GITHUB_OUTPUT"
            echo "Detected JavaScript project: $project_dir"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "No changed JavaScript project manifest; lockfile repair is not needed."
          fi

      - name: Fix lockfiles
        if: steps.detect-project.outputs.has_project == 'true'
        uses: oleg-koval/dependabot-lockfile-fixer@c7002b60b8621ba70c11ec3ab793cc845c1b236d # v1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ steps.detect-project.outputs.working_directory }}
