name: Dependabot Fetch Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  metadata:
    name: Fetch Dependabot PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check PR author
        id: author-check
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "PR authored by ${{ github.event.pull_request.user.login }}; Dependabot metadata fetch not applicable."
          fi
      - name: Fetch Metadata from Dependabot PRs
        if: steps.author-check.outputs.is_dependabot == 'true'
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
          skip-verification: true
