# Self-healing CI: when the CI workflow fails on main, download the failed job's
# log, diagnose it, and — only when the fix is safe and locally verified — open a
# pull request with it.
#
# This workflow never writes to `main`. Its output is a branch under `selfheal/`
# plus a PR for a human to review; `docs/CONTRIBUTING.md`'s non-author approval
# rule applies to it exactly as it does to any other PR.
#
# Two things worth knowing when reading a run:
#   * The job exits 0 whether or not a fix was found. "This failure is not
#     safely fixable" is a successful run — read the step summary for the
#     terminal status, not the job's colour.
#   * A PR opened with GITHUB_TOKEN does not itself trigger workflows, so CI on
#     the fix branch has to be started by a maintainer (close/reopen the PR, or
#     push an empty commit). The agent verifies locally before pushing, which is
#     why that is a review inconvenience rather than a correctness gap.
name: Self-Healing CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id to heal (defaults to the latest failed CI run)."
        required: false
        type: string
      dry_run:
        description: "Diagnose only — apply nothing, push nothing."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: self-healing-ci-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  heal:
    # Three conditions, and the first is a security boundary rather than a
    # convenience filter.
    #
    # `workflow_run` runs in the context of the *base* repository: it gets this
    # job's `contents: write` / `pull-requests: write` token and the
    # `ANTHROPIC_API_KEY` secret. The `branches: [main]` filter on the trigger
    # does *not* make the run safe — it matches the head branch *name*, so a
    # pull request opened from a fork's own `main` branch produces a CI run
    # whose `head_branch` is `main` and whose `head_sha` is the contributor's
    # commit. For that reason the checkout below deliberately uses
    # `github.sha` (the base repository's own default-branch commit) rather
    # than `workflow_run.head_sha` — this job never checks out or executes a
    # commit it did not already trust. That is what keeps Scorecard's
    # `DangerousWorkflowID` (untrusted code checkout) quiet even though this
    # workflow holds write credentials.
    #
    # The first condition is the fork guard, kept as defence in depth: it
    # refuses to run at all when the triggering run came from a fork, so a
    # fork's commit is never even fetched. The other two are the original
    # behaviour: act only on a genuine failure, and never on a run that was
    # itself started from a fix branch — that is how an agent ends up healing
    # its own output.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'failure' &&
       !startsWith(github.event.workflow_run.head_branch, 'selfheal/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push the fix branch
      pull-requests: write   # open the PR
      actions: read          # download the failed run's logs

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout the base repository's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check for a diagnosis credential
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No ANTHROPIC_API_KEY configured — nothing to diagnose with." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the failed job log
        if: steps.creds.outputs.available == 'true'
        id: log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID}" ]; then
            RUN_ID="$(gh run list --workflow CI --status failure --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          # --log-failed gives only the failing steps, which is what the ingestor
          # wants; fall back to the whole log if the run has already been purged.
          gh run view "${RUN_ID}" --log-failed > ci-failure.log \
            || gh run view "${RUN_ID}" --log > ci-failure.log
          wc -l ci-failure.log

      - name: Configure git identity
        if: steps.creds.outputs.available == 'true'
        run: |
          git config user.name "sakthai-selfheal[bot]"
          git config user.email "selfheal@users.noreply.github.com"

      - name: Diagnose and heal
        if: steps.creds.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.log.outputs.run_id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          uv run sakthai heal run \
            --log ci-failure.log \
            --repo-root . \
            --run-id "${RUN_ID}" \
            --run-url "${RUN_URL}" \
            --base main \
            --report heal-report.md \
            --json ${DRY_RUN} | tee heal-outcome.json

      - name: Publish the outcome to the run summary
        if: always() && steps.creds.outputs.available == 'true'
        run: |
          {
            echo "## Self-healing CI"
            echo
            if [ -f heal-outcome.json ]; then
              echo '```json'
              cat heal-outcome.json
              echo '```'
            fi
            if [ -f heal-report.md ]; then
              echo
              cat heal-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the diagnosis artefacts
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-healing-diagnosis
          path: |
            ci-failure.log
            heal-report.md
            heal-outcome.json
          retention-days: 7
          if-no-files-found: ignore
