name: Hugging Face integration

on:
  # Provider availability and billing are account-specific; keep this live
  # integration check explicit so it cannot block repository CI unexpectedly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SAKTHAI_HF_API_BASE: https://router.huggingface.co/v1
      # The SakThai merged checkpoint remains the application default, but may
      # not be enabled for every account's Inference Provider subscription.
      SAKTHAI_HF_SMOKE_MODEL: Qwen/Qwen2.5-7B-Instruct:together
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Require Hugging Face secret
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is required for the live integration test." >&2
            exit 1
          fi

      - name: Run custom-tool live inference
        run: uv run python scripts/hf_integration_smoke.py
