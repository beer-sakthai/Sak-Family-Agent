name: Add Reviewers to GitHub PR

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  add-reviewers:
    name: Add Reviewers to PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add Reviewers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'beer-sakthai'
        uses: crxqhuinvaiuoznzedkh/actions-add-reviewers@31c8c487b1642f4b7cad9556bf9b759882b57914 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: "beer-sakthai"
          omit-reviewer: "true"
          re-request-when-changes-requested: "true"
          re-request-when-approved: "false"
