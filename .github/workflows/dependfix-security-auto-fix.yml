# Dependfix Security Auto Fix Workflow
# Automated remediation and reporting for Dependabot & Code Scanning alerts

name: Dependfix Security Auto Fix

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode (report-only, fix, fix-and-pr)"
        required: false
        default: "report-only"
        type: choice
        options:
          - "report-only"
          - "fix"
          - "fix-and-pr"
      severity_threshold:
        description: "Minimum severity threshold"
        required: false
        default: "high"
        type: choice
        options:
          - "low"
          - "medium"
          - "high"
          - "critical"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependfix:
    name: Dependfix Security Remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dependfix
        uses: dependfix/dependfix@80883880c7016b093c4721cc5a8b2d51eef102a0 # v1.1.0
        with:
          mode: ${{ inputs.mode || 'report-only' }}
          severity-threshold: ${{ inputs.severity_threshold || 'high' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: "true"
