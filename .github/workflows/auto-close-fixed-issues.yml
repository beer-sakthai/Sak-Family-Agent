name: Auto Close Fixed Issues

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      comment:
        description: "Comment on the closing issue(s)"
        required: false
        default: "This issue was closed by #{{ pr }}."
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-close:
    name: Auto Close Fixed Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Auto Close Fixed Issues
        uses: wow-actions/auto-close-fixed-issues@d87a73261d3881451f5b35a80cfe0eaed3e95931 # v1.1.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment: ${{ inputs.comment || 'This issue was closed by #{{ pr }}.' }}
