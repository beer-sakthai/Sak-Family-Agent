name: Dependabot Automerge

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automerge:
    name: Automerge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Evaluate automerge eligibility
        id: check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "PR authored by $PR_AUTHOR; Dependabot automerge action bypassed."
          fi
      - name: Automatically Merge Dependabot PRs
        if: steps.check.outputs.is_dependabot == 'true'
        uses: invi5H/dependabot-automerge@aea0b2bd7e72af2f06118ce377821568046589f6 # v1.0.0
