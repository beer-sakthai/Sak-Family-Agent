name: Dependabot Automerge

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automerge:
    name: Automerge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Evaluate automerge eligibility
        id: check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          # invi5H/dependabot-automerge's own "Verify Dependabot" step fails
          # the job (exit 1) unless github.actor == 'dependabot[bot]'. A
          # dependabot PR's later synchronize events are frequently
          # triggered by other automation (e.g. branch auto-update bots)
          # re-pushing the base branch merge, which left this check
          # gating on PR_AUTHOR alone and invoking the action in a context
          # it was guaranteed to fail in. Require both to match so we only
          # ever invoke it when it can actually succeed.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$EVENT_ACTOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "PR authored by $PR_AUTHOR (event actor $EVENT_ACTOR); Dependabot automerge action bypassed."
          fi
      - name: Automatically Merge Dependabot PRs
        if: steps.check.outputs.is_dependabot == 'true'
        uses: invi5H/dependabot-automerge@aea0b2bd7e72af2f06118ce377821568046589f6 # v1.0.0
