name: Playwright CI Debugger

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-debugger:
    name: Playwright CI Debugger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Debug Playwright CI
        uses: sentinelqa-dev/playwright-ci-debugger@bab033ef5aa646071e0f6bae2a9ca927e14ddbf8 # v1.2.0
        if: always()
        with:
          fail-on-missing-json: "false"
          playwright-json-path: "test-results/report.json"
          playwright-report-dir: "playwright-report"
          test-results-dir: "test-results"
