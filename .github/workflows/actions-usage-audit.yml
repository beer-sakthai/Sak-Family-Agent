name: GitHub Actions Usage Audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usage-audit:
    name: Audit Actions Minutes Usage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit Workflow Usage
        uses: fergusmacd/github-actions-usage@86eef42173b5fe9778e33326468f51cc5a34348c # v0.9.2
        continue-on-error: true
        with:
          organisation: beer-sakthai
          gitHubAPIKey: ${{ github.token }}

      - name: Fallback Actions Usage Summary
        if: always()
        run: |
          echo "### GitHub Actions Usage Audit" >> $GITHUB_STEP_SUMMARY
          echo "Note: Full organization billing metrics require an organization account and a PAT with billing permissions." >> $GITHUB_STEP_SUMMARY
          echo "Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
