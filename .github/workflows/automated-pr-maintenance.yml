# Automated PR and Maintenance Workflow
# Creates automated maintenance commits and opens PRs for scheduled repository hygiene

name: Automated Maintenance PR

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name for automated changes'
        required: true
        default: 'automation/scheduled-hygiene'
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore(automation): scheduled repository hygiene and sync'
        type: string
      pr_title:
        description: 'Pull Request title'
        required: false
        default: 'chore(automation): scheduled repository hygiene'
        type: string

permissions:
  contents: read

concurrency:
  group: automated-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Commit and push changes
        uses: devops-infra/action-commit-push@be5ba37125c79eb0016cbd8cc385f0aa160538c5 # v0.9.2
        with:
          github_token: ${{ github.token }}
          commit_prefix: "[automation]"
          commit_message: ${{ inputs.commit_message }}
          target_branch: ${{ inputs.branch_name }}

      - name: Open Pull Request
        uses: devops-infra/action-pull-request@e66e2ba93519dc63b9884a26e620e2fd0cffab2c # v0.5.5
        with:
          github_token: ${{ github.token }}
          source_branch: ${{ inputs.branch_name }}
          target_branch: main
          title: ${{ inputs.pr_title }}
          template: .github/PULL_REQUEST_TEMPLATE.md
          body: "**SakJules · Master of Automation & CI/CD.**\n\nAutomated maintenance PR."
          label: automation,maintenance
