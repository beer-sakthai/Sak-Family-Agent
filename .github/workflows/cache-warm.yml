# Primes the dependency caches on `main` so pull-request runs start warm.
#
# WHY A SEPARATE WORKFLOW
#
# GitHub Actions caches are scoped by branch, and the scoping is deliberately
# one-way: a run on a branch can read caches written by its own ref, by its
# base branch, and by the repository's default branch — never by a sibling
# branch. So a cache first written by a pull-request run is visible to that
# pull request and to nothing else, and the *next* pull request starts cold
# again. Only an entry written on `main` is readable by every branch.
#
# That is the whole reason this file exists. Without it the caching added to
# ci.yml, pylint.yml and subprojects.yml only pays off from a branch's second
# run onward, which for a short-lived agent branch is usually never. With it,
# the first run on a fresh branch restores the entry `main` wrote.
#
# It gates nothing. Every step is a cache write; the workflow has no assertions
# and its failure means the next PR run installs from PyPI, exactly as it did
# before.
name: Warm dependency caches

on:
  push:
    branches: ["main"]
    paths:
      # Only the files that can change what a cache entry should contain. A
      # docs-only push to `main` would write an entry byte-identical to the one
      # already there.
      - "pyproject.toml"
      - "uv.lock"
      - "services/teams-copilot-mcp/uv.lock"
      - "apps/sak_agent_dashboard/pnpm-lock.yaml"
      - ".github/actions/setup-uv-python/action.yml"
      - ".github/workflows/cache-warm.yml"
  schedule:
    # Weekly, Monday 04:00 UTC — ahead of the working week and of
    # dependency-audit.yml's 05:30 Monday run. GitHub evicts any cache entry
    # not read for 7 days, so a repository that goes quiet for a week would
    # otherwise come back cold on every branch at once.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No `cancel-in-progress`: this never runs on a pull request, and a cancelled
  # warm run leaves the cache in whatever state the previous one left it —
  # there is nothing to supersede, only work to redo.
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  uv:
    name: uv (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry per cache partition a gating workflow will look for. The
        # `cache-suffix` values must match the callers exactly — a suffix typo
        # here does not fail anything, it just writes an entry nobody reads.
        include:
          - python-version: "3.11"
            sync-args: "--locked --all-extras"
            cache-suffix: ""            # ci.yml, default suffix (py3.11)
          - python-version: "3.12"
            sync-args: "--locked --all-extras"
            cache-suffix: ""            # ci.yml, default suffix (py3.12)
          - python-version: "3.11"
            sync-args: "--locked --all-extras --group lint"
            cache-suffix: "pylint-py3.11"
          - python-version: "3.12"
            sync-args: "--locked --all-extras --group lint"
            cache-suffix: "pylint-py3.12"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Populate the uv cache
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: ${{ matrix.sync-args }}
          cache-suffix: ${{ matrix.cache-suffix }}

  pnpm:
    name: pnpm + Next.js build cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/sak_agent_dashboard
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `package_json_file` is required and not cosmetic — see the long note in
      # subprojects.yml. This repository has no root package.json, so without
      # the path the action finds no version source at all.
      - name: Install pnpm
        uses: step-security/action-setup@7734f5522f614a4cf2820ad19aa26717c7abfd96 # v6.0.9
        with:
          package_json_file: apps/sak_agent_dashboard/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sak_agent_dashboard/pnpm-lock.yaml

      - name: Populate the pnpm store
        run: pnpm install --frozen-lockfile

      # The build is here to *produce* the `.next/cache` contents, not to check
      # anything — `subprojects.yml` is the gate that decides whether the
      # dashboard builds. A build failure on `main` will already have failed
      # there; here it only means the next PR gets a cold compile.
      - name: Build once to populate the Next.js compiler cache
        run: pnpm build

      - name: Clean up old Next.js cache entries
        run: |
          # Remove build artifacts older than 7 days to prevent unbounded cache growth
          find apps/sak_agent_dashboard/.next/cache -type f -atime +7 -delete 2>/dev/null || true
          echo "Cleaned up stale cache entries"

      - name: Save the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/sak_agent_dashboard/.next/cache
          # Same key family as subprojects.yml's restore (`nextjs-v3-`), keyed
          # on the lockfile hash only. A per-commit SHA here would both fail to
          # match what the gating workflow restores and write one ~150 MB entry
          # per push; with this key the warm entry is restorable by every
          # branch and is replaced only when the lockfile changes.
          key: nextjs-v3-${{ runner.os }}-${{ hashFiles('apps/sak_agent_dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-v3-${{ runner.os }}-
