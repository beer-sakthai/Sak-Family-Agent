# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# This workflow only echoes an input; it needs no repository scopes at all.
permissions: {}

# Two manual dispatches carry different inputs, so never cancel one for another.
concurrency:
  group: manual-${{ github.run_id }}
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    # The input is passed through `env:` rather than interpolated into the
    # script body. A `${{ }}` expression is substituted into the shell source
    # before it runs, so an input containing shell metacharacters would execute
    # as code -- the `actions/code-injection` sink that codeql.yml's `actions`
    # security-extended leg reports.
    - name: Send greeting
      env:
        GREETING_NAME: ${{ inputs.name }}
      run: echo "Hello $GREETING_NAME"
