# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string
      require_approval:
        # Require manual approval gate before execution
        description: 'Require manual workflow approval gate before proceeding'
        default: false
        required: false
        type: boolean

permissions:
  contents: read

# Two manual dispatches carry different inputs, so never cancel one for another.
concurrency:
  group: manual-${{ github.run_id }}
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Optional approval gate using trstringer/manual-approval
  approval-gate:
    if: ${{ inputs.require_approval }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      - name: Manual Workflow Approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: beer-sakthai
          minimum-approvals: 1
          issue-title: "Manual Approval Required: Manual workflow #${{ github.run_number }}"
          issue-body: "Manual workflow approval requested by @${{ github.actor }} for run ${{ github.run_id }}."

  # This workflow contains a job called "greet"
  greet:
    needs: [approval-gate]
    if: ${{ always() && (needs.approval-gate.result == 'success' || needs.approval-gate.result == 'skipped') }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    # The input is passed through `env:` rather than interpolated into the
    # script body. A `${{ }}` expression is substituted into the shell source
    # before it runs, so an input containing shell metacharacters would execute
    # as code -- the `actions/code-injection` sink that codeql.yml's `actions`
    # security-extended leg reports.
    - name: Send greeting
      env:
        GREETING_NAME: ${{ inputs.name }}
      run: echo "Hello $GREETING_NAME"
