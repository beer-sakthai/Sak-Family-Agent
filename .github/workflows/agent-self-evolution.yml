name: agent-self-evolution

on:
  push:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  pull_request:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

# Standalone package (not a uv workspace member — see CLAUDE.md), so it gets its
# own install + pytest run rather than joining ci.yml, which is scoped to the
# sakthai core only. Each persona carries a copy; personas/sakthai's is the
# canonical one CI tests.
# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: agent-self-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: personas/sakthai/agent-self-evolution
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (pytest)
        run: pytest tests/ -q
