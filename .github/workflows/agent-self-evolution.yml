name: agent-self-evolution

on:
  push:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  pull_request:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # See the note in ci.yml: cancel superseded pull-request runs, never a run on
  # `main`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Standalone package (not a uv workspace member — see CLAUDE.md), so it gets its
# own install + pytest run rather than joining ci.yml, which is scoped to the
# sakthai core only. Each persona carries a copy; personas/sakthai's is the
# canonical one CI tests.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: personas/sakthai/agent-self-evolution
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This subproject installs with pip, not uv (it is not a uv workspace
      # member and carries no lock), so the cache is `setup-python`'s own wheel
      # cache. It is keyed on the subproject's `pyproject.toml` — the file that
      # declares what `.[dev]` resolves to — rather than the action's default
      # `**/requirements.txt`, which matches nothing this job installs.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personas/sakthai/agent-self-evolution/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (pytest)
        run: pytest tests/ -q
