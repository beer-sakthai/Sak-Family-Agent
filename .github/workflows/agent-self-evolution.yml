name: agent-self-evolution

on:
  push:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  pull_request:
    branches: [main]
    paths:
      - "personas/sakthai/agent-self-evolution/**"
      - ".github/workflows/agent-self-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Standalone package (not a uv workspace member — see CLAUDE.md), so it gets its
# own install + pytest run rather than joining ci.yml, which is scoped to the
# sakthai core only. Each persona carries a copy; personas/sakthai's is the
# canonical one CI tests.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: personas/sakthai/agent-self-evolution
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install
        # Standalone package (see CLAUDE.md) — install with uv pip into the
        # runner's Python rather than uv sync, since this project is not a
        # member of the top-level uv workspace.
        run: uv pip install --system -e ".[dev]"

      - name: Tests (pytest)
        run: pytest tests/ -q
