name: Git Auto Commit

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for changed files"
        required: false
        default: "chore: automated file update [skip ci]"
        type: string
      file_pattern:
        description: "File pattern or path to commit"
        required: false
        default: "."
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    name: Auto Commit Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Auto-commit changed files
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "${{ inputs.commit_message || 'chore: automated file update' }}"
          file_pattern: ${{ inputs.file_pattern || '.' }}
