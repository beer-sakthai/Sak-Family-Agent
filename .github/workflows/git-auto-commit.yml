name: Git Auto Commit

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for changed files"
        required: false
        default: "chore: automated file update [skip ci]"
        type: string
      file_pattern:
        description: "File pattern or path to commit"
        required: false
        default: "."
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    name: Auto Commit Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Auto-commit changed files
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "${{ inputs.commit_message || 'chore: automated file update' }}"
          file_pattern: ${{ inputs.file_pattern || '.' }}
