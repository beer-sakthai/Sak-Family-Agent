name: Reusable Workflow Dispatch

on:
  workflow_dispatch:
    inputs:
      target_workflow:
        description: Workflow filename to trigger
        required: false
        default: lint-check.yml
  workflow_call:
    inputs:
      target_workflow:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch target workflow
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: ${{ inputs.target_workflow }}
          token: ${{ github.token }}
