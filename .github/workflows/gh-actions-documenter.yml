name: GitHub Actions Documenter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-actions-documenter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document:
    name: Generate Action & Workflow Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Document Workflows
        uses: gizumon/github-actions-documenter@843a0f92e66b5db20f76d3c707beb0329b48c628 # v0.2.2
        with:
          target-filepaths: ".github/workflows"
          should-skip-generate-agenda: "false"
