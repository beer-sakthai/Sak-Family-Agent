name: Safe Dependabot Policy

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/safe-dependabot.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Dependabot Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Safe Dependabot Policy Check
        uses: DiogoRibeiro7/safe-dependabot@6108108e756497ce9c7b4e9e38d76fea453c1181 # v1.1.1
        with:
          config-path: ".github/dependabot.yml"
          max-open-prs: "10"
          require-major-ignore: "false"
          detect-ecosystems: "false"
