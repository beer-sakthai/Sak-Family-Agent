# This workflow runs the full quality suite on every push and pull request
# to the main branch. It is the source of truth for the project's quality bar.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_TIMEOUT: "120"
  UV_HTTP_RETRIES: "5"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let the Python 3.12 leg reach AutoHeal-CI even if another matrix leg fails.
      fail-fast: false
      # Run the test suite against all supported Python versions.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # Install optional integrations plus the uv dependency group containing
        # the linting, typing, security, and test tools used below.
        run: uv sync --locked --all-extras --dev

      - name: Run linters
        run: |
          uv run --locked ruff check personas/sakthai tests
          uv run --locked ruff format --check personas/sakthai tests

      - name: Run static analysis
        run: |
          uv run --locked mypy
          uv run --locked bandit -c pyproject.toml -r personas/sakthai

      - name: Run tests with coverage
        # --cov-fail-under is passed explicitly rather than relying on
        # [tool.coverage.report] fail_under, which pytest-cov printed but which
        # did not fail this step -- finding 1 of
        # docs/test-coverage-audit-2026-08-27.md.
        run: uv run --locked pytest --cov=sakthai --cov-report=xml --cov-fail-under=96 tests/

      - name: Upload coverage report
        # Absorbed from repository-security-quality.yml's `quality` job, which
        # otherwise duplicated this entire job on Python 3.11. Here it gets both
        # matrix legs rather than one, hence the version in the artifact name.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor (fail_under = 96) is enforced by pytest itself;
          # a failed upload (e.g. no CODECOV_TOKEN secret) must not fail CI.
          fail_ci_if_error: false

  # Keep the write-capable self-healing action out of the matrix job. Normal CI
  # runs with read-only repository access; this job runs once only after the
  # matrix has failed and is separately scoped to the permissions it requires.
  autoheal:
    name: AutoHeal-CI recovery
    if: always() && !cancelled()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Verify CI test health
        id: health-check
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "needs_heal=true" >> "$GITHUB_OUTPUT"
            echo "Test suite failed; initiating AutoHeal recovery evaluation."
          else
            echo "needs_heal=false" >> "$GITHUB_OUTPUT"
            echo "All CI matrix tests succeeded; test suite is healthy. AutoHeal recovery not required."
          fi

      - name: Checkout repository
        if: steps.health-check.outputs.needs_heal == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        if: steps.health-check.outputs.needs_heal == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.health-check.outputs.needs_heal == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: steps.health-check.outputs.needs_heal == 'true'
        run: uv sync --locked --all-extras --dev

      - name: Check AutoHeal-CI secret
        if: steps.health-check.outputs.needs_heal == 'true'
        id: autoheal-secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not configured; skipping AutoHeal-CI."
          fi

      - name: Install AutoHeal-CI runtime
        if: steps.health-check.outputs.needs_heal == 'true' && steps.autoheal-secret.outputs.available == 'true'
        run: uv pip install --system "git+https://github.com/nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7"

      - name: AutoHeal-CI Self-Healing Bot
        if: steps.health-check.outputs.needs_heal == 'true' && steps.autoheal-secret.outputs.available == 'true'
        uses: nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7 # v1.3.0
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-3.8-flash"
          provider: "gemini"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Keep reproduction focused on behavioral tests; coverage is enforced by the CI step above.
          test_command: "uv run --locked pytest tests/"
          max_rounds: "2"
          max_budget_usd: "1.50"
          create_pr: "true"
