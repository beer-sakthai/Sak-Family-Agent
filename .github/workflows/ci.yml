# This workflow runs the full quality suite on every push and pull request
# to the main branch. It is the source of truth for the project's quality bar.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run the test suite against all supported Python versions.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        # Install all optional dependencies to ensure linting/testing tools are present.
        run: uv sync --all-extras

      - name: Run linters
        run: |
          uv run ruff check personas/sakthai/sakthai tests
          uv run ruff format --check personas/sakthai/sakthai tests

      - name: Run static analysis
        run: |
          uv run mypy personas/sakthai/sakthai
          uv run bandit -c pyproject.toml -r personas/sakthai/sakthai

      - name: Run tests with coverage
        # --cov-fail-under is passed explicitly rather than relying on
        # [tool.coverage.report] fail_under, which pytest-cov printed but which
        # did not fail this step -- finding 1 of
        # docs/test-coverage-audit-2026-08-27.md.
        run: uv run pytest --cov=sakthai --cov-report=xml --cov-fail-under=96 tests/

      - name: Upload coverage report
        # Absorbed from repository-security-quality.yml's `quality` job, which
        # otherwise duplicated this entire job on Python 3.11. Here it gets both
        # matrix legs rather than one, hence the version in the artifact name.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor (fail_under = 96) is enforced by pytest itself;
          # a failed upload (e.g. no CODECOV_TOKEN secret) must not fail CI.
          fail_ci_if_error: false