# This workflow runs the full quality suite on every push and pull request
# to the main branch. It is the source of truth for the project's quality bar.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run the test suite against all supported Python versions.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # Install all optional dependencies to ensure linting/testing tools are present.
        run: uv sync --locked --all-extras

      - name: Run linters
        run: |
          uv run --locked ruff check personas/sakthai tests
          uv run --locked ruff format --check personas/sakthai tests

      - name: Run static analysis
        run: |
          uv run --locked mypy
          uv run --locked bandit -c pyproject.toml -r personas/sakthai

      - name: Run tests with coverage
        # --cov-fail-under is passed explicitly rather than relying on
        # [tool.coverage.report] fail_under, which pytest-cov printed but which
        # did not fail this step -- finding 1 of
        # docs/test-coverage-audit-2026-08-27.md.
        run: uv run --locked pytest --cov=sakthai --cov-report=xml --cov-fail-under=96 tests/

      - name: Upload coverage report
        # Absorbed from repository-security-quality.yml's `quality` job, which
        # otherwise duplicated this entire job on Python 3.11. Here it gets both
        # matrix legs rather than one, hence the version in the artifact name.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor (fail_under = 96) is enforced by pytest itself;
          # a failed upload (e.g. no CODECOV_TOKEN secret) must not fail CI.
          fail_ci_if_error: false

      - name: Check AutoHeal-CI secret
        if: failure() && matrix.python-version == '3.12'
        id: autoheal-secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; skipping AutoHeal-CI."
          fi

      - name: AutoHeal-CI Self-Healing Bot
        if: failure() && matrix.python-version == '3.12' && steps.autoheal-secret.outputs.available == 'true'
        uses: nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7 # v1.3.0
        with:
          api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o"
          provider: "openai"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_command: "uv run --locked pytest --cov=sakthai --cov-report=xml --cov-fail-under=96 tests/"
          max_rounds: "1"
          create_pr: "true"
