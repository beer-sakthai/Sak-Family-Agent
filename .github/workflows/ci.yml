# This workflow runs the full quality suite on every push and pull request
# to the main branch. It is the source of truth for the project's quality bar.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  # One run per branch. `cancel-in-progress` is deliberately scoped to pull
  # requests: a superseded PR run is wasted minutes, but a cancelled run on
  # `main` leaves a gap in the coverage/code-scanning record, and
  # self-healing-ci.yml keys off this workflow's conclusion there — a
  # `cancelled` run is neither a success it can ignore nor a failure it can heal.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Opt-in self-hosted execution. Set the repository variable
    # `CI_RUNNER_LABEL` (Settings -> Secrets and variables -> Actions ->
    # Variables) to a registered runner label and CI moves onto that hardware;
    # delete the variable and the next run is back on `ubuntu-latest`. No
    # workflow edit either way.
    #
    # Written as a fallback rather than a hard-coded `[self-hosted]` because
    # the failure mode of the latter is not a failure: a job targeting a label
    # with no online runner does not error, it *queues* — silently, for up to
    # 24 hours, and then expires. One unreachable VM would stall every pull
    # request in the repository with nothing red to point at.
    #
    # See infra/self-hosted-runner/README.md, and read its first section before
    # setting the variable: a self-hosted runner must not be reachable by pull
    # requests from forks.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # Run the test suite against all supported Python versions.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One step for interpreter + uv + dependency cache + locked install.
      # This used to be `setup-python` -> `pipx install uv` -> `uv sync
      # --all-extras`, which pulled an unpinned uv and re-downloaded the entire
      # locked closure from PyPI on every run of every matrix leg. See the
      # action's own comments for what the cache is keyed on and why each leg
      # gets its own partition.
      #
      # `--locked` (not a bare `uv sync`) is the same contract pylint.yml
      # already holds: install exactly what uv.lock records and fail on drift,
      # rather than silently re-resolving. `--all-extras` stays — hypothesis
      # lives in the `dev` extra and tests/test_store_properties.py fails
      # collection without it, which aborts the whole run.
      - name: Set up Python ${{ matrix.python-version }} and uv
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: "--locked --all-extras"

      - name: Run linters
        run: |
          uv run ruff check personas/sakthai/sakthai tests
          uv run ruff format --check personas/sakthai/sakthai tests

      - name: Run static analysis
        run: |
          uv run mypy personas/sakthai/sakthai
          uv run bandit -c pyproject.toml -r personas/sakthai/sakthai

      - name: Run tests with coverage
        # `-m "not integration"` is the documented CI contract (see CLAUDE.md):
        # integration tests may hit real endpoints (Ollama/Anthropic). They also
        # self-skip when credentials are absent, but relying on that alone means
        # one integration test missing its `skipif` guard turns CI into a
        # network-dependent job. Exclude them by marker, explicitly.
        run: uv run pytest -m "not integration" --cov=sakthai --cov-branch --cov-report=xml tests/

      - name: Upload coverage to Codecov
        uses: step-security/codecov-action@db5c3605ff3c9dc7f0b2791e6bea84a561bacab8 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor (fail_under = 96) is enforced by pytest itself;
          # a failed upload (e.g. no CODECOV_TOKEN secret) must not fail CI.
          fail_ci_if_error: false