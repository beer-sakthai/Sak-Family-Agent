# This workflow runs the full quality suite on every push and pull request
# to the main branch. It is the source of truth for the project's quality bar.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run the test suite against all supported Python versions.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # `pipx install uv` used to stand here: an unpinned install of an
      # unpinned uv, with no dependency cache behind it, so every one of this
      # matrix's two legs re-downloaded and re-built the whole locked tree on
      # every push and every pull request. The action below is SHA-pinned and
      # restores `~/.cache/uv` between runs, which is what turns `uv sync` into
      # a hardlink pass over already-downloaded wheels.
      #
      # `cache-dependency-glob` is narrowed on purpose. The action's default
      # glob is `**/pyproject.toml`, `**/uv.lock`, `**/*requirements*.txt` and
      # friends — in this monorepo that matches 16 tracked files, including
      # `services/teams-copilot-mcp/uv.lock`, the folded-in `sakthai-chat-cli/`
      # copy, and two persona *skill* requirement files that have nothing to do
      # with this job's environment. Every one of them would invalidate this
      # cache on change. Only the root `pyproject.toml`/`uv.lock` describe what
      # `uv sync --all-extras` installs here, so only those two key it.
      #
      # `cache-suffix` keys each matrix leg separately: 3.11 and 3.12 resolve
      # different wheels for the same lock, and a shared key would have them
      # overwrite each other's cache on every run.
      - name: Install uv
        uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: ci-py${{ matrix.python-version }}

      - name: Install dependencies
        # Install all optional dependencies to ensure linting/testing tools are present.
        # --locked: install exactly what uv.lock records and fail on drift from
        # pyproject.toml, rather than silently re-resolving — a re-resolve would
        # also miss the cache the step above just restored.
        run: uv sync --locked --all-extras

      - name: Run linters
        run: |
          uv run ruff check personas/sakthai/sakthai tests
          uv run ruff format --check personas/sakthai/sakthai tests

      - name: Run static analysis
        run: |
          uv run mypy personas/sakthai/sakthai
          uv run bandit -c pyproject.toml -r personas/sakthai/sakthai

      - name: Run tests with coverage
        # `-m "not integration"` is the documented CI contract (see CLAUDE.md):
        # integration tests may hit real endpoints (Ollama/Anthropic). They also
        # self-skip when credentials are absent, but relying on that alone means
        # one integration test missing its `skipif` guard turns CI into a
        # network-dependent job. Exclude them by marker, explicitly.
        run: uv run pytest -m "not integration" --cov=sakthai --cov-branch --cov-report=xml tests/

      - name: Upload coverage to Codecov
        uses: step-security/codecov-action@db5c3605ff3c9dc7f0b2791e6bea84a561bacab8 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor (fail_under = 96) is enforced by pytest itself;
          # a failed upload (e.g. no CODECOV_TOKEN secret) must not fail CI.
          fail_ci_if_error: false