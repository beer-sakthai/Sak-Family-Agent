name: Reusable Dispatch Method

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target repository
        required: false
        default: Sak-Family-Agent
  workflow_call:
    inputs:
      target_repo:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Dispatches to different repositories cannot corrupt the same repository state.
  # Keep dispatches to the same target repository serialized.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target_repo }}
  cancel-in-progress: true

jobs:
  dispatch-custom:
    name: Dispatch Workflow Event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Dispatch
        uses: lasith-kg/dispatch-workflow@2597e9a3d222d7959052dea1c009560bbeb495e4 # v3.0.0
        with:
          dispatch-method: workflow_dispatch
          owner: beer-sakthai
          repo: ${{ inputs.target_repo }}
          token: ${{ github.token }}
          workflow: lint-check.yml
