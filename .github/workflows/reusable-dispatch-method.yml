name: Reusable Dispatch Method

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target repository
        required: false
        default: Sak-Family-Agent
  workflow_call:
    inputs:
      target_repo:
        type: string
        required: true

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-custom:
    name: Dispatch Workflow Event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Trigger Dispatch
        uses: lasith-kg/dispatch-workflow@2597e9a3d222d7959052dea1c009560bbeb495e4 # v3.0.0
        with:
          dispatch-method: workflow_dispatch
          owner: beer-sakthai
          repo: ${{ inputs.target_repo }}
          token: ${{ github.token }}
          workflow: lint-check.yml
