name: npm Audit Fix

on:
  workflow_dispatch:
    inputs:
      working_dir:
        description: "Project directory containing package.json"
        required: false
        default: "apps/sak_agent_dashboard"
        type: string
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit-fix:
    name: Run npm Audit Fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run npm Audit Fix
        uses: grandmasterdev/github-action-npm-audit-fix@acb53f70fb4406f6b03e9df77ab5a76611b024b5 # v1.1.0
        with:
          working-dir: ${{ inputs.working_dir || 'apps/sak_agent_dashboard' }}
          github-user: "github-actions[bot]"
          github-email: "github-actions[bot]@users.noreply.github.com"
          github-token: ${{ secrets.GITHUB_TOKEN }}
