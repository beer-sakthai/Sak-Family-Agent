name: Dependabot Auto Merge CLI

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to pass to Dependabot"
        required: false
        default: "squash and merge"
        type: string
      target:
        description: "Version comparison target (major, minor, patch)"
        required: false
        default: "patch"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Dependabot Auto Merge CLI
        uses: ahmadnassri/action-dependabot-auto-merge@45fc124d949b19b6b8bf6645b6c9d55f4f9ac61a # v2.6.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          command: ${{ inputs.command || 'squash and merge' }}
          target: ${{ inputs.target || 'patch' }}
