name: Multi-Linter Action

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      auto_fix:
        description: "Automatically fix lint errors"
        required: false
        default: "false"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run Multi-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Linting Action
        uses: ryanclark/lint-action@316d8bd29e28a292657682f6c6e45ca1dab41496 # v1.15.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          continue_on_error: "true"
          auto_fix: ${{ inputs.auto_fix || 'false' }}
          black: "false"
          flake8: "false"
          mypy: "true"
          mypy_command_prefix: "uv run"
          mypy_dir: "."
          mypy_args: "personas/sakthai"
