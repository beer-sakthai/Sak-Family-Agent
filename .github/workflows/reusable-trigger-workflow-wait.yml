name: Reusable Trigger Workflow and Wait

on:
  workflow_dispatch:
    inputs:
      workflow_file:
        description: Target workflow file
        required: false
        default: lint-check.yml
  workflow_call:
    inputs:
      workflow_file:
        type: string
        required: true

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-wait:
    name: Trigger and Wait
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Trigger remote workflow
        uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: beer-sakthai
          repo: Sak-Family-Agent
          github_token: ${{ github.token }}
          workflow_file_name: ${{ inputs.workflow_file }}
