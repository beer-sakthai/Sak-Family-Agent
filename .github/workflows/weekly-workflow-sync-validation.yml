name: Weekly workflow and synchronization validation

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: weekly-workflow-sync-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows and synchronization status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PAGER: cat
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install workflow validation tools
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/workflow-linter-requirements.lock
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/zizmor-requirements.lock

      - name: Validate workflow YAML and permission declarations
        run: python scripts/lint_workflow_permissions.py

      - name: Scan every workflow for security issues
        run: zizmor --no-online-audits --config .github/zizmor.yml .github/workflows/

      - name: Report workflow and synchronization status
        shell: bash
        run: |
          set -euo pipefail
          summary_file="${RUNNER_TEMP}/workflow-sync-status.md"
          workflows_file="${RUNNER_TEMP}/active-workflows.tsv"
          prs_file="${RUNNER_TEMP}/open-prs.json"

          gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | [.id, .name, .path] | @tsv' \
            > "${workflows_file}"

          {
            echo "## Workflow inventory"
            echo
            echo "| Workflow | File | Latest run on \\`${DEFAULT_BRANCH}\\` | Result |"
            echo "|---|---|---:|---|"
          } > "${summary_file}"

          workflow_count=0
          while IFS=$'\\t' read -r workflow_id workflow_name workflow_path; do
            [ -n "${workflow_id}" ] || continue
            workflow_count=$((workflow_count + 1))
            latest_run="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=${DEFAULT_BRANCH}&per_page=1" \
              --jq '.workflow_runs[0] // {} | [.status, .conclusion, .html_url] | @tsv')"
            IFS=$'\\t' read -r run_status run_conclusion run_url <<< "${latest_run}"
            run_status="${run_status:-no run}"
            run_conclusion="${run_conclusion:-not available}"
            run_url="${run_url:-}"
            if [ -n "${run_url}" ]; then
              result="[${run_conclusion}](${run_url})"
            else
              result="${run_conclusion}"
            fi
            printf '| `%s` | `%s` | `%s` | %s |\\n' \
              "${workflow_name}" "${workflow_path}" "${run_status}" "${result}" \
              >> "${summary_file}"
          done < "${workflows_file}"

          echo "" >> "${summary_file}"
          echo "Active workflows checked: **${workflow_count}**" >> "${summary_file}"
          echo "" >> "${summary_file}"
          echo "## Open pull-request synchronization" >> "${summary_file}"
          echo "" >> "${summary_file}"
          gh pr list --repo "${REPOSITORY}" --state open --limit 100 \
            --json number,title,headRefName,baseRefName,mergeStateStatus,updatedAt,url \
            > "${prs_file}"
          pr_count="$(jq 'length' "${prs_file}")"
          if [ "${pr_count}" -eq 0 ]; then
            echo "No open pull requests." >> "${summary_file}"
          else
            {
              echo '| PR | Head → base | Merge/sync status | Updated |'
              echo '|---:|---|---|---|'
              jq -r '.[] | "| [#\(.number)](\(.url)) \(.title | gsub("\\|"; "\\\\|")) | `\(.headRefName)` → `\(.baseRefName)` | `\(.mergeStateStatus)` | \(.updatedAt) |"' "${prs_file}"
            } >> "${summary_file}"
          fi

          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Weekly workflow and synchronization validation completed for ${REPOSITORY}."
