name: Bot Check Action

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-bot:
    name: Check Creator Authenticity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout shared authorization action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/check-automation-permissions

      - name: Check creator verification authorization
        id: authorization
        uses: ./.github/actions/check-automation-permissions
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verification-token: ${{ secrets.PAT_VERIFICATION_TOKEN }}
          require-verification-token: 'true'

      - name: Run Bot Check
        if: steps.authorization.outputs.authorized == 'true'
        uses: dohyeon5626/bot-check-action@4f0b434cd4999aa880bd4ed4855105a1c9cefba5 # v1.1
        with:
          comment-account-token: ${{ secrets.GITHUB_TOKEN }}
          personal-access-token: ${{ secrets.PAT_VERIFICATION_TOKEN }}
          auto-close: "false"
          verification-timeout: "5"
