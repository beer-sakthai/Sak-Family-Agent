name: Bot Check Action

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-bot:
    name: Check Creator Authenticity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check PAT verification secret
        id: check-secret
        env:
          PAT_VERIFICATION_TOKEN: ${{ secrets.PAT_VERIFICATION_TOKEN }}
        run: |
          if [ -n "$PAT_VERIFICATION_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PAT_VERIFICATION_TOKEN is not configured; skipping bot verification check."
          fi

      - name: Run Bot Check
        if: steps.check-secret.outputs.available == 'true'
        uses: dohyeon5626/bot-check-action@4f0b434cd4999aa880bd4ed4855105a1c9cefba5 # v1.1
        with:
          comment-account-token: ${{ secrets.GITHUB_TOKEN }}
          personal-access-token: ${{ secrets.PAT_VERIFICATION_TOKEN }}
          auto-close: "false"
          verification-timeout: "5"
