name: Dependabot Helper

on:
  workflow_dispatch:
    inputs:
      who-to-greet:
        description: "Target identity or bot to greet"
        required: false
        default: "Dependabot"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper:
    name: Run Dependabot Helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Dependabot Helper
        uses: onebalaban/DependabotHelper@9455093e7f3d2338e9eeb42984865e29660e3ad8 # v1
        with:
          who-to-greet: ${{ inputs.who-to-greet || 'Dependabot' }}
