name: Dependabot Helper

on:
  workflow_dispatch:
    inputs:
      who-to-greet:
        description: "Target identity or bot to greet"
        required: false
        default: "Dependabot"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper:
    name: Run Dependabot Helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dependabot Helper
        uses: onebalaban/DependabotHelper@9455093e7f3d2338e9eeb42984865e29660e3ad8 # v1
        with:
          who-to-greet: ${{ inputs.who-to-greet || 'Dependabot' }}
