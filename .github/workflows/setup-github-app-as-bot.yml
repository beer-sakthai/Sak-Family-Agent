name: Setup GitHub App as Bot

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-app-bot:
    name: Setup GitHub App Identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Bot App secrets
        id: check-secrets
        env:
          BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_CLIENT_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_CLIENT_ID or BOT_APP_PRIVATE_KEY not set; skipping app setup."
          fi

      - name: Configure GitHub App as Bot
        if: steps.check-secrets.outputs.available == 'true'
        uses: SimonMarquis/setup-github-app-as-bot@a778f68e0790a7d0dbebc9fbc2187048026b1a15 # v1
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          gh-auth-login: "false"
          gh-auth-setup-git: "false"
          set-git-user: "true"
