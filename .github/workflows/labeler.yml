---
name: Labeler

on: [pull_request_target]

permissions:
  contents: read

concurrency:
  # pull_request_target: github.ref resolves to the base branch (e.g. refs/heads/main),
  # so every PR would share one group. Key on the PR number instead so a re-run
  # cancels only stale runs for the same PR — not other PRs' labeler jobs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
