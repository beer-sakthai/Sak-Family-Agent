name: Update pull request branches from protected bases

on:
  push:
    branches: ["main", "staging", "develop"]
  schedule:
    # Run a weekly reconciliation so open PR branches stay current even when
    # no protected-base push event was observed.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch whose open pull requests should be updated, or all protected bases
        required: true
        default: all
        type: choice
        options:
          - all
          - main
          - staging
          - develop

permissions: {}

concurrency:
  group: update-pr-branches-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  select-bases:
    name: Select protected base branches
    runs-on: ubuntu-latest
    outputs:
      base_branches: ${{ steps.select.outputs.base_branches }}
    steps:
      - name: Select synchronization scope
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          REQUESTED_BASE: ${{ inputs.base_branch || '' }}
        run: |
          set -euo pipefail

          # A push to main keeps every protected development line current.
          # Pushes to staging/develop and manual single-base runs only update
          # pull requests targeting that selected base.
          if [[ "${EVENT_NAME}" == "push" && "${TRIGGER_BRANCH}" == "main" ]] \
            || [[ "${EVENT_NAME}" == "schedule" ]] \
            || [[ "${REQUESTED_BASE}" == "all" ]]; then
            echo "base_branches=main,staging,develop" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${REQUESTED_BASE}" ]]; then
            echo "base_branches=${REQUESTED_BASE}" >> "${GITHUB_OUTPUT}"
          else
            echo "base_branches=${TRIGGER_BRANCH}" >> "${GITHUB_OUTPUT}"
          fi

  update-branches:
    name: Synchronize pull request branches
    needs: select-bases
    uses: ./.github/workflows/reusable-update-pr-branches.yml # zizmor: ignore[self-repository]
    with:
      base_branches: ${{ needs.select-bases.outputs.base_branches }}
    permissions:
      contents: write
      pull-requests: write
