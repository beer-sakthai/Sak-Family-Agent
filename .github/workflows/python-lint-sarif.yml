# Python Lint Code Scanning Workflow
# Multi-linter and type checker with SARIF report upload to GitHub Code Scanning

name: Python Lint Code Scanning

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      linter:
        description: "Linter or type checker to execute (ruff, flake8, pylint, mypy)"
        required: false
        default: "ruff"
        type: choice
        options:
          - "ruff"
          - "flake8"
          - "pylint"
          - "mypy"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Python Lint with SARIF Export
        uses: advanced-security/python-lint-code-scanning-action@7ebf81c5860ee4d41849872bc2f95b4243c8dc28 # v1.1.3
        with:
          linter: ${{ inputs.linter || 'ruff' }}
          python-version: "3.11"
          target: "personas/sakthai"
          output: "ruff.sarif"
