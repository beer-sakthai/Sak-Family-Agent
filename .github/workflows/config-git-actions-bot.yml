name: Config Git Actions Bot

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config-git-bot:
    name: Configure Git Bot Committer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328bc45ebf3f0e5e316812709 # v2.10.4
        with:
          egress-policy: audit

      - name: Configure Git Actions Bot Committer
        uses: drengskapur/gitbot-config@00aecab0a790b146951f9e0c48f564eaf26a9df6 # v1.1.2
