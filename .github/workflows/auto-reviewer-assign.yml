name: Auto Reviewer Assign

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assign:
    name: Automatically Assign Reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration file
        id: check_config
        run: |
          if [ -f .github/auto-reviewer-assign.yml ]; then
            echo "config_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Configuration file .github/auto-reviewer-assign.yml not found. Skipping auto-assign."
            echo "config_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Automatically assign reviewers
        if: github.event_name == 'pull_request' && steps.check_config.outputs.config_exists == 'true'
        uses: johnmanjiro13/auto-reviewer-assign@cac72d552c3f3163adfb7bc4a3f676163911d0ef # v0.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
