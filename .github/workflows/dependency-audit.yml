# Audits the locked Python dependency set against known-vulnerability
# databases (OSV / PyPI advisories). Dependabot proposes version bumps, but
# nothing else in CI fails when a *current* pin has a published CVE — this
# workflow closes that gap. Runs weekly, on dependency changes, and on demand.
#
# It also audits the training stack, which Dependabot cannot see at all: it
# reads neither the hashed .lock files under infra/sakthai-training-space/
# nor PEP 723 inline script metadata.
name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "infra/sakthai-training-space/*.lock"
      - "training/**/*.py"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Export locked requirements
        # --no-emit-project: audit third-party deps only, not the local package.
        #
        # --all-groups is not redundant with --all-extras. Extras are
        # [project.optional-dependencies]; groups are PEP 735
        # [dependency-groups], and uv will not export a group unless asked.
        # Without it the `evals` group -- lm-eval and its ~270 transitive
        # dependencies, installed by run-evals.yml -- was never audited, which
        # is how accelerate, nltk and sqlitedict sat here with published CVEs
        # while this workflow reported "No known vulnerabilities found".
        run: uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes -o requirements.txt

      - name: Run pip-audit
        # --no-deps is safe: uv export already emits the fully resolved,
        # pinned dependency closure, so there is nothing left to resolve.
        #
        # No --ignore-vuln entries. nltk (PYSEC-2026-3740) and sqlitedict
        # (PYSEC-2026-1939) used to be ignored here because neither has a
        # fixed release; they are now kept out of uv.lock altogether by
        # [tool.uv] override-dependencies in pyproject.toml. Prefer that, or an
        # upgrade, to an ignore: a stale ignore silently re-opens the hole this
        # workflow exists to close.
        #
        # The sed strips local version tags first. The `evals` group pins
        # torch==2.14.0+cpu, which pip-audit skips as "not found on PyPI"
        # while still reporting "No known vulnerabilities found".
        run: |
          sed -i -E 's/\+(cpu|cu[0-9]+)//' requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --no-deps

      - name: Audit the training image locks
        # The three hashed locks the training Space image installs from. The
        # +cuNNN local version tags are stripped first: pip-audit skips
        # torch==2.14.1+cu130 as "not found on PyPI" and still reports
        # "No known vulnerabilities found", so torch would go unaudited.
        run: |
          for lock in infra/sakthai-training-space/*.lock; do
            echo "::group::$lock"
            sed -E 's/\+cu[0-9]+//' "$lock" > "$RUNNER_TEMP/training-lock.txt"
            uvx pip-audit -r "$RUNNER_TEMP/training-lock.txt" --disable-pip --no-deps
            echo "::endgroup::"
          done

      - name: Audit the training scripts' inline dependencies
        # Every script under training/ that carries a PEP 723 header (the HF
        # Jobs and serving scripts). uv resolves each header the way
        # `uv run <script>` / `hf jobs uv run` would, then pip-audit checks
        # the result.
        run: |
          for script in $(git ls-files -- 'training/*.py' | xargs -r grep -l '^# /// script$'); do
            echo "::group::$script"
            uv export --quiet --script "$script" --no-hashes -o "$RUNNER_TEMP/script-requirements.txt"
            uvx pip-audit -r "$RUNNER_TEMP/script-requirements.txt" --disable-pip --no-deps
            echo "::endgroup::"
          done
