# Audits the locked Python dependency set against known-vulnerability
# databases (OSV / PyPI advisories). Dependabot proposes version bumps, but
# nothing else in CI fails when a *current* pin has a published CVE — this
# workflow closes that gap. Runs weekly, on dependency changes, and on demand.
name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Export locked requirements
        # --no-emit-project: audit third-party deps only, not the local package.
        #
        # --all-groups is not redundant with --all-extras. Extras are
        # [project.optional-dependencies]; groups are PEP 735
        # [dependency-groups], and uv will not export a group unless asked.
        # Without it the `evals` group -- lm-eval and its ~270 transitive
        # dependencies, installed by run-evals.yml -- was never audited, which
        # is how accelerate, nltk and sqlitedict sat here with published CVEs
        # while this workflow reported "No known vulnerabilities found".
        run: uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes -o requirements.txt

      - name: Run pip-audit
        # --no-deps is safe: uv export already emits the fully resolved,
        # pinned dependency closure, so there is nothing left to resolve.
        #
        # The two --ignore-vuln entries are accepted risk, not dismissal: both
        # are transitive dependencies of lm-eval reached only by run-evals.yml,
        # and NEITHER HAS A FIXED RELEASE -- the newest version on PyPI is the
        # last affected one in each case. Drop the corresponding flag the
        # moment an upstream fix ships; leaving a stale ignore here silently
        # re-opens the hole this workflow exists to close.
        #
        #   PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp) nltk <=3.10.3, latest 3.10.3
        #     -- model-artifact APIs can touch files outside allowed roots.
        #        Reached only via rouge-score, on Hub artifacts we select.
        #   PYSEC-2026-1939 (CVE-2024-35515) sqlitedict <=2.1.0, latest 2.1.0
        #     -- insecure deserialization of an attacker-controlled DB file.
        #        lm-eval only ever opens caches it wrote itself.
        run: |
          uvx pip-audit -r requirements.txt --disable-pip --no-deps \
            --ignore-vuln PYSEC-2026-3740 \
            --ignore-vuln PYSEC-2026-1939
