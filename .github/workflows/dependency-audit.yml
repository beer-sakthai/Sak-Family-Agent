# Audits the locked Python dependency set against known-vulnerability
# databases (OSV / PyPI advisories). Dependabot proposes version bumps, but
# nothing else in CI fails when a *current* pin has a published CVE — this
# workflow closes that gap. Runs weekly, on dependency changes, and on demand.
name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Export locked requirements
        # --no-emit-project: audit third-party deps only, not the local package.
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements.txt

      - name: Run pip-audit
        # --no-deps is safe: uv export already emits the fully resolved,
        # pinned dependency closure, so there is nothing left to resolve.
        run: uvx pip-audit -r requirements.txt --disable-pip --no-deps
