name: Reusable Workflow Dispatch and Wait

on:
  workflow_dispatch:
    inputs:
      target_workflow:
        description: Workflow name or filename to trigger
        required: false
        default: lint-check.yml
  workflow_call:
    inputs:
      target_workflow:
        type: string
        required: true

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-wait:
    name: Dispatch and Wait
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Trigger and wait
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4.0.0
        with:
          workflow: ${{ inputs.target_workflow }}
          token: ${{ github.token }}
