name: AutoHeal-CI

on:
  workflow_dispatch:
    inputs:
      test_command:
        description: "Test command to reproduce and verify"
        required: false
        default: "pytest tests/test_version.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoheal:
    name: AutoHeal CI Self-Healing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Gemini secret
        id: check-secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not configured; skipping AutoHeal-CI."
          fi

      - name: Set up uv
        if: steps.check-secret.outputs.available == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install AutoHeal-CI runtime
        if: steps.check-secret.outputs.available == 'true'
        run: uv pip install --system "git+https://github.com/nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7"

      - name: Run AutoHeal Engine
        if: steps.check-secret.outputs.available == 'true'
        uses: nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7 # v1.3.0
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-3.8-flash"
          provider: "gemini"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_command: ${{ inputs.test_command }}
          max_rounds: "2"
          max_budget_usd: "1.50"
          create_pr: "false"
