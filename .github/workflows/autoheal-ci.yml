name: AutoHeal-CI

on:
  workflow_dispatch:
    inputs:
      test_command:
        description: "Test command to reproduce and verify"
        required: false
        default: "pytest tests/test_version.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoheal:
    name: AutoHeal CI Self-Healing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install AutoHeal-CI runtime
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        run: uv pip install --system "git+https://github.com/nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7"

      - name: Run AutoHeal Engine
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        uses: nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7f33d7 # v1.3.0
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-3.8-flash"
          provider: "gemini"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_command: ${{ inputs.test_command }}
          max_rounds: "2"
          max_budget_usd: "1.50"
          create_pr: "false"
