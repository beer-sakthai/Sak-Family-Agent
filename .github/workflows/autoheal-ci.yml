name: AutoHeal-CI

on:
  workflow_dispatch:
    inputs:
      test_command:
        description: "Test command to reproduce and verify"
        required: false
        default: "pytest tests/test_version.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  autoheal:
    name: AutoHeal CI Self-Healing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run AutoHeal Engine
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        uses: nolekek/AutoHeal-CI@eafa410862f761d5a8f96ea946d07c9d0d7 # v1.3.0
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-1.5-pro"
          provider: "gemini"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_command: ${{ inputs.test_command }}
          max_rounds: "3"
          max_budget_usd: "2.00"
          create_pr: "false"
