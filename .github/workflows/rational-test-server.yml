name: Rational Test Automation Server

on:
  workflow_dispatch:
    inputs:
      test_asset_id:
        description: "Test Asset ID in Rational Test Automation Server"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rtas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run RTAS Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Execute Rational Test Automation Server Action
        if: env.RTAS_SERVER_URL != '' && env.RTAS_OFFLINE_TOKEN != ''
        uses: IBM/devopsauto-testserver-actions@e8a4eee816315e2f1f0adcf06e6c56fc61bdee37 # v1
        env:
          RTAS_SERVER_URL: ${{ secrets.RTAS_SERVER_URL }}
          RTAS_OFFLINE_TOKEN: ${{ secrets.RTAS_OFFLINE_TOKEN }}
        with:
          serverUrl: ${{ secrets.RTAS_SERVER_URL }}
          offlineToken: ${{ secrets.RTAS_OFFLINE_TOKEN }}
          assetId: ${{ inputs.test_asset_id }}
