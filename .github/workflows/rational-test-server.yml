name: Rational Test Automation Server

on:
  workflow_dispatch:
    inputs:
      test_asset_id:
        description: "Test Asset ID in Rational Test Automation Server"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rtas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run RTAS Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute Rational Test Automation Server Action
        if: env.RTAS_SERVER_URL != '' && env.RTAS_OFFLINE_TOKEN != ''
        uses: IBM/devopsauto-testserver-actions@c704855bdbbae4f0df152919d00fb0bd40f67ee0 # v1
        env:
          RTAS_SERVER_URL: ${{ secrets.RTAS_SERVER_URL }}
          RTAS_OFFLINE_TOKEN: ${{ secrets.RTAS_OFFLINE_TOKEN }}
        with:
          serverUrl: ${{ secrets.RTAS_SERVER_URL }}
          offlineToken: ${{ secrets.RTAS_OFFLINE_TOKEN }}
          assetId: ${{ inputs.test_asset_id }}
