name: Google Chat Dispatcher

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Status message to send'
        required: false
        default: 'House of Sak system notification'
  workflow_call:
    inputs:
      status:
        description: 'Status message to send'
        required: false
        type: string
        default: 'House of Sak system notification'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-google-chat:
    name: Dispatch Google Chat Card
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Send Google Chat Notification
        if: env.GOOGLE_CHAT_WEBHOOK != ''
        uses: dtherhtun/google-chat-action@dec309966ac02aa06cf79fb930096919ed8d7baf # v0.9
        with:
          webhook: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          project: 'House of Sak'
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          status: ${{ inputs.status || 'success' }}
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

      - name: Dry Run Notification
        if: env.GOOGLE_CHAT_WEBHOOK == ''
        env:
          STATUS_MSG: ${{ inputs.status || 'success' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "GOOGLE_CHAT_WEBHOOK secret not configured; running in dry-run mode."
          echo "Status: $STATUS_MSG"
          echo "Branch: $BRANCH_NAME"
