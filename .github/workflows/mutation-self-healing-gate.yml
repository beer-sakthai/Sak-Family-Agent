name: Sak-Family Mutation Testing & Self-Healing CI Gate

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sak_agent_dashboard/**'
      - 'personas/**'
      - '.github/workflows/mutation-self-healing-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/sak_agent_dashboard/**'
      - 'personas/**'
      - '.github/workflows/mutation-self-healing-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-gate:
    name: AST Mutation Testing & Self-Healing Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sak_agent_dashboard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sak_agent_dashboard/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Mutation Quality Gate Runner
        run: ./scripts/run_mutation_gate.sh
