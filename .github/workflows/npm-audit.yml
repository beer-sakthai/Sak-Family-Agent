name: npm Audit Action

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/sak_agent_dashboard/package.json"
      - "apps/sak_agent_dashboard/package-lock.json"
      - ".github/workflows/npm-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/sak_agent_dashboard/package.json"
      - "apps/sak_agent_dashboard/package-lock.json"
      - ".github/workflows/npm-audit.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: Run npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run npm audit action
        uses: oke-py/npm-audit-action@da53d502b06a0bc95f9ce3c0ebab0c4c713fae4a # v5.5.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: "apps/sak_agent_dashboard"
          audit_level: "high"
          production_flag: "true"
          ignore_ghsas: "GHSA-fc5q-39xc-vjpf"
          create_issues: "false"
          create_pr_comments: "true"
          resolve_pr_comments: "true"
          report_format: "markdown"
          fail_on_vulnerabilities: "true"
