# Synchronize documentation from docs/ to GitHub Wiki (.wiki.git)
# Triggers on push to main affecting docs/

name: Wiki Sync

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Prepare Wiki Documentation Structure
        run: |
          mkdir -p build/wiki
          python scripts/sync_wiki.py --docs-dir docs --wiki-dir build/wiki

      - name: Check if Wiki is initialized
        id: check_wiki
        run: |
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "wiki_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Wiki git repository is not initialized yet. Skipping sync until initial wiki page is created."
            echo "wiki_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Documentation to Wiki
        if: steps.check_wiki.outputs.wiki_ready == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: build/wiki
          strategy: clone
