name: Playwright Test Failure Triage Bot

on:
  workflow_dispatch:
    inputs:
      report_path:
        description: "Path to Playwright JSON test report"
        required: false
        default: "test-results.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage-failure:
    name: Triage Playwright Failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328bc45ebf3f0e5e316812709 # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Test Failure Triage Bot
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        uses: AhmedHoussou/action-test-failure-triage@e0d3f0498d8518bf8a7da1356005b09e7109ed55 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          report-path: ${{ inputs.report_path }}
