name: Workflow Conclusion Evaluator

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-task:
    name: Upstream Task
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Execute primary step
        run: echo "Upstream task completed successfully."

  evaluate-conclusion:
    name: Evaluate Job Conclusions
    needs: [upstream-task]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Evaluate conclusions
        uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3

      - name: Report conclusion
        env:
          CONCLUSION: ${{ env.WORKFLOW_CONCLUSION }}
        run: |
          echo "Evaluated workflow conclusion: $CONCLUSION"
