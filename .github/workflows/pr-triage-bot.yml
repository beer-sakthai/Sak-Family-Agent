name: PR Triage Bot

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    name: Triage Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PR Triage
        uses: dinakars777/pr-triage-action@423e4bee6992248223e6bc4f5840c0ca2e9c0dcf # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          duplicate-threshold: "0.8"
          enable-labels: "true"
          enable-duplicate-check: "true"
          enable-contributor-profile: "true"
