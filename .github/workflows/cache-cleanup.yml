name: Cleanup PR Caches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report orphaned caches without deleting them
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: cache-cleanup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cleanup-cache:
    name: Purge closed PR caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - name: Check out cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/cleanup_pr_caches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Delete caches for PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bash scripts/cleanup_pr_caches.sh
