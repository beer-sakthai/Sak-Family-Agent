# Secret scanning gate. SECURITY.md promises a gitleaks run on every push and
# pull request; this workflow is that gate. It scans the full git history using
# the repo's .gitleaks.toml (which allowlists test fixtures, instructional
# persona docs, and already-scrubbed values inherited from merged-repo history).
name: Secret Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
  # The branch-sweep job below is gated on `schedule` or `workflow_dispatch`.
  # Without this cron it was reachable only by manual dispatch, so the sweep
  # over every branch tip never actually ran — the per-PR gitleaks job only
  # scans a pull request's own commit range, leaving secrets on branches that
  # were never opened as a PR unscanned behind a green check.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commit history, not just the checked-out tree.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-sweep:
    # Every branch tip's whole tree, not a commit range. This is the job that
    # would have caught the Kaggle token described in the header.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Branch sweep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository (all branches)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned by version *and* digest, and downloaded rather than piped into a
      # shell — the same rule the rest of the repository follows for third-party
      # installers. The release asset is immutable, so the digest is stable.
      #
      # To move to a new gitleaks, update both and re-pin with:
      #   curl -sSL ".../gitleaks_<V>_linux_x64.tar.gz" | sha256sum
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # Each branch is checked out detached and scanned with `--no-git`, so what
      # is examined is the tree as it stands, including files untouched for
      # months.
      #
      # The config is taken from the DEFAULT BRANCH and passed with `--config`,
      # not read from each branch's own checkout. Two reasons, and the first is
      # the one that matters: otherwise a branch could silence a finding about
      # itself by committing an allowlist entry alongside the secret. The second
      # is that a branch merely behind `main` would re-report every false
      # positive `main` has already triaged, and a sweep that is always red is a
      # sweep nobody reads.
      - name: Sweep every branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/leak-reports
          git show "origin/${DEFAULT_BRANCH}:.gitleaks.toml" > /tmp/gitleaks.toml
          status=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$'); do
            branch="${ref#origin/}"
            slug="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9._-' '_')"
            report="/tmp/leak-reports/${slug}.json"
            if ! git checkout -q --detach "$ref" 2>/dev/null; then
              echo "::warning::could not check out ${branch}, skipping"
              continue
            fi
            # `--no-git` scans the working directory, and `git checkout` only
            # manages tracked files: anything untracked or gitignored survives
            # into the next branch's scan and is reported against it. Without
            # this the sweep misattributes one branch's file to all of them —
            # observed while testing, where a single planted file was reported
            # on every branch including ones that never had it.
            git clean -qxffd
            /tmp/gitleaks detect --no-git --redact --no-banner --exit-code=0 \
              --config /tmp/gitleaks.toml \
              --report-format=json --report-path="$report" --source . >/dev/null 2>&1 || true
            n="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$report" 2>/dev/null || echo 0)"
            if [ "$n" -gt 0 ]; then
              status=1
              echo "::error::${n} secret finding(s) on branch ${branch}"
              python3 -c 'import json,sys; [print("  %-22s %s:%s" % (f["RuleID"], f["File"], f["StartLine"])) for f in json.load(open(sys.argv[1]))]' "$report"
            else
              echo "  clean: ${branch}"
            fi
          done
          exit "$status"

      # Uploaded whether or not the sweep failed: a clean report is the evidence
      # that the sweep actually ran over every branch, which a green tick alone
      # does not show.
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-branch-sweep
          path: /tmp/leak-reports/
          retention-days: 14
