name: CODEOWNERS Bot Generator

on:
  push:
    paths:
      - '**/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-codeowners:
    name: Compile Monorepo CODEOWNERS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CODEOWNERS Bot
        uses: gmolau/codeowners@efba36333e402884498dc49d216d2f9612bd69a8 # v0.1.5

      - name: Verify Root CODEOWNERS
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "Compiled .github/CODEOWNERS verified."
          else
            echo "No root .github/CODEOWNERS generated."
          fi
