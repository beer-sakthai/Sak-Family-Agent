name: Generate Roadmap

on:
  milestone:
    types: [created, closed, edited]
  workflow_dispatch:
    inputs:
      output_path:
        description: 'File path for generated roadmap markdown'
        required: false
        default: 'ROADMAP.md'
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    name: Generate Roadmap from Milestones & Issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate Mermaid Roadmap
        uses: inat-get/action-is-roadmap@9fecd4863d39e5033e9c641a381e00d9c1a21265 # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_type: 'file'
          output_path: ${{ inputs.output_path || 'ROADMAP.md' }}
          config_file: '.github/roadmap-styles.yml'
