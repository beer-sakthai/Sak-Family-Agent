name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

# Serialise per issue/PR thread. `cancel-in-progress: false` on purpose: two `/oc`
# comments are two different tasks, so cancelling the first would discard work the
# commenter asked for. Queueing them also caps how fast an unattended run can spend
# the OpenCode Go budget, which is shared with interactive usage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@14b37df39168eaf6a6faf862ec4a7bbe9c825bbd  # v1.18.18
        env:
          # The OpenCode Go subscription key (https://opencode.ai/auth). The action
          # forwards only its own declared inputs to the CLI, but step-level `env:`
          # is inherited by the composite's run steps — the same route the Gemini
          # key used before this workflow moved onto Go.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Go plan provider. $0.22/$0.66 per Mtok, 1M context, tool calling — and
          # the model docs/SOUL.md already names as SakThai's model policy.
          model: opencode-go/deepseek-v4-flash
          # This repository is public, and `share` defaults to true for public
          # repos — which publishes an opencode.ai session link carrying the
          # agent's reasoning trace on every run. Opt out explicitly.
          share: "false"
