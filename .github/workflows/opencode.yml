name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

# Serialise per issue/PR thread. `cancel-in-progress: false` on purpose: two `/oc`
# comments are two different tasks, so cancelling the first would discard work the
# commenter asked for. Queueing them also caps how fast an unattended run can spend
# the OpenCode Go budget, which is shared with interactive usage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    # 15 was too tight: run 32296190427 was cancelled at exactly 15:05 with the
    # agent still working. The dependency install added below costs another
    # minute or two on a cold cache, so the budget goes up rather than down.
    # This is Actions minutes, which are free on a public repository — the
    # OpenCode Go spend is metered in tokens, not wall time, so a longer ceiling
    # does not cost more per run.
    timeout-minutes: 20
    # `use_github_token: true` below skips the OIDC exchange, so no `id-token:
    # write` is needed. It also means these three lines are the real ceiling on
    # what the agent can do: the CLI runs on GITHUB_TOKEN, which Actions scopes
    # to exactly this block. The OpenCode App token it would otherwise fetch
    # carries the *app installation's* permissions and ignores this block
    # entirely — which is why the default is not what we want here.
    #
    # `issues: write` and `pull-requests: write` are what let the agent answer.
    # The action posts a reaction on the triggering comment and then a reply;
    # with read-only scopes both calls 403 and the step exits 1 having done
    # nothing (runs 32294069990 and 32295093264). `issues: write` covers issue
    # threads and PR *conversation* comments; `pull-requests: write` covers the
    # `pull_request_review_comment` trigger declared above, which replies on the
    # review thread through a different endpoint. `contents: read` is the line
    # that still matters: the agent cannot push, branch, or open a pull request.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      # Without this the agent has no tools. `opencode.json` registers the
      # sakthai MCP server as `uv run --project . sakthai mcp`, but nothing in
      # this job installed uv or the project's dependencies, so that server
      # failed to start and the agent silently lost all 14 builtin tools —
      # leaving it to reason over a checkout it could not read with anything but
      # its own file tools. Same pinned action, cache and lockfile as `ci.yml`.
      - name: Set up Python and uv
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: "3.11"
          cache-suffix: opencode

      - name: Run opencode
        uses: anomalyco/opencode/github@14b37df39168eaf6a6faf862ec4a7bbe9c825bbd  # v1.18.18
        env:
          # The OpenCode Go subscription key (https://opencode.ai/auth). The action
          # forwards only its own declared inputs to the CLI, but step-level `env:`
          # is inherited by the composite's run steps — the same route the Gemini
          # key used before this workflow moved onto Go.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Read by the CLI because of `use_github_token: true`. Actions does not
          # export this on its own — only the `github.token` context exists — so
          # it has to be passed explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI-only config overlay. The repo-root `opencode.json` sets
          # `permission.bash: "ask"` on purpose — an interactive prompt nobody
          # can answer in a headless run, which is the same as denying shell —
          # and `tests/test_agent_cli_configs.py::test_opencode_gates_bash`
          # pins that value, so the fix is not to loosen it. This file overrides
          # `permission` for CI only: bash allowed, and `edit` denied because
          # `contents: read` means an edit could never be pushed anyway — better
          # the agent proposes a patch than silently writes one into a checkout
          # that is thrown away. It deliberately does *not* restate the persona
          # `agent:` table; duplicating that is the drift
          # `test_agent_cli_configs.py` exists to catch.
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode-ci.json
        with:
          # Authenticate to GitHub with the job's own GITHUB_TOKEN instead of
          # exchanging an OIDC token for an OpenCode GitHub App installation
          # token. Two reasons: the app token's permissions come from the app
          # install rather than this workflow's `permissions:` block, so the
          # read-only posture above would not actually bind; and the default
          # path requires github.com/apps/opencode-agent to be installed on the
          # repository, making the workflow fail closed on a missing install.
          use_github_token: "true"
          # Go plan provider. $0.22/$0.66 per Mtok, 1M context, tool calling — and
          # the model docs/SOUL.md already names as SakThai's model policy.
          model: opencode-go/deepseek-v4-flash
          # This repository is public, and `share` defaults to true for public
          # repos — which publishes an opencode.ai session link carrying the
          # agent's reasoning trace on every run. Opt out explicitly.
          share: "false"
