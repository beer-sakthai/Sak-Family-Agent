name: Weekly workflow validation and synchronization status

on:
  schedule:
    # Run after the weekly branch synchronization reconciliation.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-workflow-validation
  cancel-in-progress: false

jobs:
  validate-workflows:
    name: Validate repository workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install YAML validation dependency
        run: |
          python3 -m pip install --disable-pip-version-check \
            --require-hashes -r .github/workflow-linter-requirements.lock

      - name: Parse workflows and check embedded Bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import yaml

          workflow_files = sorted(
              path
              for path in Path(".github/workflows").iterdir()
              if path.suffix in {".yml", ".yaml"}
          )
          if not workflow_files:
              raise SystemExit("No workflow YAML files were found.")

          def visit(value, path):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "run" and isinstance(child, str):
                          with tempfile.NamedTemporaryFile("w", suffix=".sh") as script:
                              script.write(child)
                              script.flush()
                              subprocess.run(["bash", "-n", script.name], check=True)
                          print(f"Bash OK: {path}")
                      visit(child, path)
              elif isinstance(value, list):
                  for child in value:
                      visit(child, path)

          for workflow in workflow_files:
              with workflow.open() as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{workflow} is not a YAML mapping")
              print(f"YAML OK: {workflow}")
              visit(document, workflow)
          PY

      - name: Check workflow permission policy
        run: python3 scripts/lint_workflow_permissions.py

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Weekly workflow validation"
            echo "- Parsed all `.yml` and `.yaml` files in `.github/workflows`."
            echo "- Checked embedded Bash syntax."
            echo "- Ran the repository workflow permission linter."
          } >> "${GITHUB_STEP_SUMMARY}"

  synchronization-status:
    name: Report synchronization statuses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Collect recent synchronization runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs_file="${RUNNER_TEMP}/synchronization-runs.json"
          gh run list \
            --repo "${REPOSITORY}" \
            --workflow update-pr-branches-from-main.yml \
            --limit 25 \
            --json databaseId,status,conclusion,event,createdAt,url \
            > "${runs_file}"

          failed_runs=$(jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped"))] | length' "${runs_file}")
          active_runs=$(jq '[.[] | select(.status != "completed")] | length' "${runs_file}")
          completed_runs=$(jq '[.[] | select(.status == "completed")] | length' "${runs_file}")

          {
            echo "## Weekly pull-request synchronization status"
            echo ""
            echo "- Recent completed runs: ${completed_runs}"
            echo "- Active or queued runs: ${active_runs}"
            echo "- Failed or cancelled completed runs: ${failed_runs}"
            echo ""
            echo "| Run | Event | Created | Status | Conclusion |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| [#\(.databaseId)](\(.url)) | \(.event) | \(.createdAt) | \(.status) | \(.conclusion // "") |"' "${runs_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( failed_runs > 0 )); then
            echo "::error::One or more recent synchronization runs failed or were cancelled."
            exit 1
          fi

          echo "Synchronization status validation passed."
