# Pull Request Comment Trigger Workflow
# Detects slash-commands (e.g., @deploy, /benchmark) in pull request comments

name: PR Comment Trigger

on:
  # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  issues: write

concurrency:
  group: pr-comment-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  check-comment:
    # Only run on pull requests, not regular issues
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: write

    steps:
      - name: Check for deploy trigger
        uses: Khan/pull-request-comment-trigger@edab8d9ba7759221187ef7120592a6fbfada0d18 # v1.1.0
        id: check-deploy
        with:
          trigger: '@deploy'
          reaction: rocket
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for benchmark trigger
        uses: Khan/pull-request-comment-trigger@edab8d9ba7759221187ef7120592a6fbfada0d18 # v1.1.0
        id: check-benchmark
        with:
          trigger: '/benchmark'
          reaction: eyes
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for preview trigger
        uses: Khan/pull-request-comment-trigger@edab8d9ba7759221187ef7120592a6fbfada0d18 # v1.1.0
        id: check-preview
        with:
          trigger: '/preview'
          reaction: eyes
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for test trigger
        uses: Khan/pull-request-comment-trigger@edab8d9ba7759221187ef7120592a6fbfada0d18 # v1.1.0
        id: check-test
        with:
          trigger: '/test'
          reaction: heart
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report Trigger Detection
        if: steps.check-deploy.outputs.triggered == 'true' || steps.check-benchmark.outputs.triggered == 'true' || steps.check-preview.outputs.triggered == 'true' || steps.check-test.outputs.triggered == 'true'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          echo "Trigger detected on PR #${PR_NUMBER} by @${TRIGGER_ACTOR}"
