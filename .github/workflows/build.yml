name: Docker Build Cloud & Toolchain

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Docker Build & Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Expose the secret to this one shell step only and publish a boolean that
      # every later step reads. Gating on `env.DOCKER_PAT` required repeating the
      # secret in each step's `env:`, and the Buildx step never had it, so the
      # Build Cloud driver could not turn on even with DOCKER_PAT configured.
      - name: Check Docker Hub credentials
        id: docker_creds
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [ -n "$DOCKER_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DOCKER_PAT is not set: building locally without login or push."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to Docker Hub
        if: ${{ steps.docker_creds.outputs.available == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_USER || 'sakthai001' }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ steps.docker_creds.outputs.available == 'true' && vars.DOCKER_BUILD_CLOUD_ENDPOINT != '' && 'cloud' || 'docker-container' }}
          endpoint: ${{ steps.docker_creds.outputs.available == 'true' && vars.DOCKER_BUILD_CLOUD_ENDPOINT || '' }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKER_USER || 'sakthai001' }}/docker-build-cloud-demo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sandbox
          tags: ${{ steps.meta.outputs.tags || format('{0}/docker-build-cloud-demo:latest', vars.DOCKER_USER || 'sakthai001') }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' || steps.docker_creds.outputs.available != 'true' }}
          push: ${{ github.event_name != 'pull_request' && steps.docker_creds.outputs.available == 'true' }}

      - name: Generate artifact attestation for container build
        if: ${{ steps.docker_creds.outputs.available == 'true' && steps.build_image.outputs.digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.DOCKER_USER || 'sakthai001' }}/docker-build-cloud-demo
          subject-digest: ${{ steps.build_image.outputs.digest }}
          push-to-registry: false

      - name: Verify Docker Compose Configuration
        run: |
          touch infra/servicequotebot/docker/.env
          docker compose -f infra/servicequotebot/docker/docker-compose.yml config