# Multi-Linter Verification Workflow
# Formats and validates code quality using wearerequired/lint-action

name: Lint Action

on:
  workflow_dispatch:
    inputs:
      auto_fix:
        description: 'Automatically fix formatting errors'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write

concurrency:
  group: lint-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install --no-cache-dir ruff

      - name: Run Lint Action
        uses: wearerequired/lint-action@124229c6e2974984ba137c67a499ba28bfc33e33 # v3.0.2
        with:
          github_token: ${{ github.token }}
          ruff: true
          auto_fix: ${{ inputs.auto_fix || false }}
