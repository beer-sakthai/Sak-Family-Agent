name: Gemini AI Code Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to review"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with Gemini AI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Secret Presence
        id: check_secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY secret is not configured; skipping AI code review call."
          fi

      - name: Run Gemini AI Code Review
        if: steps.check_secret.outputs.has_key == 'true'
        uses: rubensflinco/gemini-code-review-action@eff35325520e8afcd9ed86618920a4804925c05f # 1.0.6
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pull_request_number: ${{ inputs.pull_request_number || '1' }}
          git_commit_hash: ${{ github.sha }}
          model: "gemini-3.8-flash"
          pull_request_diff: "dry-run-diff"
          pull_request_chunk_size: "3500"
          log_level: "INFO"
