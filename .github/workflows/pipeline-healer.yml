name: Pipeline Healer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heal:
    name: Run DevOps Pipeline Healer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Secret Presence
        id: check_secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY secret is not configured; skipping pipeline healer execution."
          fi

      - name: Run Pipeline Healer Agent
        if: steps.check_secret.outputs.has_key == 'true'
        uses: JAI0705/DevOps_Pipeline_healer_agent@a23105b6783cdd78c9a1417f1d20d66d5cb7598d # v1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
