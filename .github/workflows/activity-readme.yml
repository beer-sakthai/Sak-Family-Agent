# GitHub Activity in Readme Workflow
# Updates documentation with recent repository activity

name: Activity Readme

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Activity Section
        uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea # v0.5.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          COMMIT_MSG: "chore(docs): update recent activity section [skip ci]"
          MAX_LINES: 5
