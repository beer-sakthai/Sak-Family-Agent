name: Sak-Family Quality Flywheel Gate

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sak_agent_dashboard/**'
      - 'personas/**'
      - '.github/workflows/quality-flywheel-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/sak_agent_dashboard/**'
      - 'personas/**'
      - '.github/workflows/quality-flywheel-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Multi-Persona Quality & G-Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/sak_agent_dashboard

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: step-security/action-setup@7734f5522f614a4cf2820ad19aa26717c7abfd96 # v6.0.9
        with:
          package_json_file: apps/sak_agent_dashboard/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sak_agent_dashboard/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Quality Gate Runner
        run: ./scripts/run_eval_quality_gate.sh
