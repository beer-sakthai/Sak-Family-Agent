# Dependabot Auto-Merge Workflow
# Automatically evaluates, approves, and auto-merges eligible Dependabot PRs

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate and auto-merge'
        required: false
        type: string
      target:
        description: 'Target SemVer update level (patch, minor, major, any)'
        required: false
        default: 'any'
        type: choice
        options:
          - 'any'
          - 'minor'
          - 'patch'
          - 'major'

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-merge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check PR author
        id: check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "PR authored by $PR_AUTHOR; Dependabot fastify merge bypassed."
          fi
      - name: Auto-Merge Dependabot PR
        if: steps.check.outputs.is_dependabot == 'true'
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ inputs.target || 'any' }}
          pr-number: ${{ inputs.pr_number || '' }}
          merge-method: squash
