name: AI PR Opener Bot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source branch to open the PR from"
        required: true
      title:
        description: "Pull request title"
        required: true
      base:
        description: "Base branch to merge into"
        required: false
        default: "main"
      draft:
        description: "Open as draft PR (true/false)"
        required: false
        default: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open AI Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open Pull Request via App Bot
        if: ${{ secrets.BOT_APP_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
        uses: teohsinyee/ai-pr-opener-bot@4c36fd7b3830433b7c7f0cd5f8c16ed6cd524351 # v1.0.0
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          branch: ${{ inputs.branch }}
          base: ${{ inputs.base }}
          title: ${{ inputs.title }}
          draft: ${{ inputs.draft }}
