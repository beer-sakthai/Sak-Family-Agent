# CodeQL advanced security analysis for Sak-Family-Agent.
#
# Scans:
#   - GitHub Actions
#   - JavaScript / TypeScript
#   - Python
#
# This is an ADVANCED CodeQL configuration.
# Make sure GitHub CodeQL Default Setup is disabled before using it.
#
# Repository configuration used by this workflow:
#   .github/codeql/codeql-config.yml

name: "CodeQL Advanced"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Weekly CodeQL scan.
    - cron: "22 15 * * 0"

  # Allow manual runs from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs for the same branch or pull request.
# Never cancel an analysis already running on main.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read

    strategy:
      fail-fast: false

      matrix:
        include:
          # Analyze GitHub Actions workflow files.
          # Use the wider security-extended query suite.
          - language: actions
            build-mode: none
            queries: security-extended

          # Analyze JavaScript and TypeScript.
          # This includes the Sak Agent dashboard.
          - language: javascript-typescript
            build-mode: none
            queries: default

          # Analyze Python.
          - language: python
            build-mode: none
            queries: default

    steps:
      # Harden the GitHub-hosted runner.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      # Checkout without leaving Git credentials in the workspace.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Initialize the CodeQL database for each matrix language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

          # Repository-specific CodeQL scope configuration.
          #
          # Make sure this file exists:
          # .github/codeql/codeql-config.yml
          config-file: ./.github/codeql/codeql-config.yml

          # GitHub Actions uses security-extended.
          # JavaScript/TypeScript and Python use the default suite.
          queries: ${{ matrix.queries }}

          # Cache dependencies used by CodeQL where supported.
          dependency-caching: true

      # Analyze the CodeQL database and upload the results.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:${{ matrix.language }}"
