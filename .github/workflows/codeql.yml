# CodeQL — GitHub's semantic static analysis — over the three languages this
# repository actually contains.
#
# This file uses advanced CodeQL setup so the repository can control languages,
# paths, build modes, and other analysis settings through the workflow and the
# CodeQL configuration file.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "22 15 * * 0"

permissions:
  contents: read

# Supersede in-flight runs for the same ref, but never cancel a run on main.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # These languages use build-mode none because no manual compilation
          # step is required by this workflow.
          - language: actions
            build-mode: none

          - language: javascript-typescript
            build-mode: none

          - language: python
            build-mode: none

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

          # Use the repository-specific CodeQL configuration to control
          # which parts of the repository are included in analysis.
          config-file: ./.github/codeql/codeql-config.yml

          # Cache dependencies resolved by CodeQL where supported.
          dependency-caching: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
