name: Enable Automerge for Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Highest update type allowed (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable Automerge for Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == (github.event.pull_request.head.repo.full_name || github.repository) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check PR author
        id: check
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "PR authored by ${{ github.event.pull_request.user.login }}; halostatue automerge bypassed."
          fi

      - name: Check out repository
        if: steps.check.outputs.is_dependabot == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable automerge via Dependabot Automerge
        if: steps.check.outputs.is_dependabot == 'true'
        uses: halostatue/dependabot-automerge@61a7c53cf7dd144b2e874cb0bc163ed4d3a89f22 # v1.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          update-type: ${{ inputs.update_type || 'patch' }}
          merge-type: 'squash'
