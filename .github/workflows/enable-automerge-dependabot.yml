name: Enable Automerge for Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Highest update type allowed (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable Automerge for Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]' &&
       github.repository == github.event.pull_request.head.repo.full_name) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable automerge via Dependabot Automerge
        uses: halostatue/dependabot-automerge@61a7c53cf7dd144b2e874cb0bc163ed4d3a89f22 # v1.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          update-type: ${{ inputs.update_type || 'patch' }}
          merge-type: 'squash'
