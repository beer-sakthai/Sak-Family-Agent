name: Auto Issue Bot Triage

on:
  schedule:
    - cron: '0 6 * * 0' # Weekly on Sunday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    name: Run Auto Issue Bot Triage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Auto Issue Bot
        uses: autoissue/autoissuebot@5af0465ff89575e2b7d9650c9a2d3fb3b6faea36 # v1.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          per-page: 20
          mode: 'read'
