# Publish an npm package when a GitHub Release is created.
#
# NOTE: Sak-Family-Agent has no root package.json — the only Node project is the
# Next.js dashboard under apps/sak_agent_dashboard, which is not an npm package.
# Set `working-directory` below to a real publishable package before enabling.
# Until then this workflow is an inactive template.

name: Node.js Package
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # working-directory: apps/<your-publishable-package>  # TODO: set the package dir
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Start in audit mode to learn the real egress set, then switch to
          # `block` with an explicit allow-list (registry.npmjs.org, nodejs.org,
          # github.com) before trusting this job with an npm token.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}