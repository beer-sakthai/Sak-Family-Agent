name: Reusable PR Comment Helper

on:
  workflow_dispatch:
    inputs:
      comment_body:
        description: Comment body
        required: false
        default: "Automated verification comment"
  workflow_call:
    inputs:
      comment_body:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Comment on PR
        uses: NejcZdovc/comment-pr@a423635d183a8259308e80593c96fecf31539c26 # v2.1.0
        with:
          file: ''
          message: ${{ inputs.comment_body }}
