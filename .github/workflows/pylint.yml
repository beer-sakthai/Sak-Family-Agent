name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -e ".[dev]" || pip install -e "."
    - name: Analysing the code with pylint
      run: |
        # Monorepo: lint only the core sakthai-agent package (canonical copy at
        # personas/sakthai/sakthai) + its tests. Other co-located trees (infra/*,
        # the other personas' package copies) carry their own quality bars and
        # are not held to this repo's pylint thresholds.
        pylint --fail-under=7.0 $(git ls-files | grep -E '^(personas/sakthai/sakthai|tests|scripts)/.*\.py$')
        pylint personas/sakthai/sakthai --disable=R0801,R0401 --fail-under=9.0
