name: Pylint

# Scoped to `main` and the pull requests targeting it, matching ci.yml. This
# used to be a bare `on: [push]`, which re-ran the two-version matrix on every
# push to every branch — including the ones that already had a pull request
# open, so each commit paid for this job twice on top of the ruff/format gate
# ci.yml runs against the same commit.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  # See the note in ci.yml: cancel superseded pull-request runs, never a run on
  # `main`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        disable-sudo: true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # This job used to install with four bare `pip install` commands, which
    # Scorecard flagged as four `PinnedDependenciesID` / `pipCommand` alerts on
    # the code-scanning dashboard (see docs/code-scanning-sweep-2026-08-12.md):
    # nothing about `pip install pylint` says *which* pylint. Everything below
    # resolves through artifacts that are pinned by digest — the action by commit
    # SHA, every wheel by the sha256 recorded in the committed uv.lock — so the
    # job installs the same bytes on every run and there is no unpinned install
    # command left to flag.
    # --locked: install exactly what uv.lock says, and fail if the lock has
    # drifted from pyproject.toml rather than silently re-resolving — a plain
    # `uv sync` would re-lock on drift, which is how an unpinned install gets
    # back in. --all-extras brings in the dev extra so pylint can resolve the
    # test suite's imports; --group lint brings in pylint itself. The evals
    # group stays out (see pyproject.toml).
    #
    # `cache-suffix` is explicit here because this job installs a *different*
    # dependency set from the same lockfile than ci.yml does — the `lint` group
    # on top of the extras. Sharing ci.yml's entry would mean each workflow
    # evicting the other's cache on every run.
    - name: Set up Python ${{ matrix.python-version }} and uv
      uses: ./.github/actions/setup-uv-python
      with:
        python-version: ${{ matrix.python-version }}
        sync-args: "--locked --all-extras --group lint"
        cache-suffix: "pylint-py${{ matrix.python-version }}"

    - name: Analysing the code with pylint
      run: |
        # Monorepo: lint only the core sakthai-agent package (canonical copy at
        # personas/sakthai/sakthai) + its tests. Other co-located trees (infra/*,
        # the other personas' package copies) carry their own quality bars and
        # are not held to this repo's pylint thresholds.
        uv run --locked pylint --fail-under=7.0 $(git ls-files | grep -E '^(personas/sakthai/sakthai|tests|scripts)/.*\.py$')
        uv run --locked pylint personas/sakthai/sakthai --disable=R0801,R0401 --fail-under=9.0
