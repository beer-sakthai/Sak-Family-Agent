name: Pylint

# Was `on: [push]` — every branch, no path filter, and no `pull_request` at all,
# so branch pushes burned a two-leg matrix while PRs from forks were never
# linted. Matched to every other gate in this repo instead.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: Sync project + dev deps
      # Hash-verified from uv.lock (which pins every package by digest). The
      # editable local install is pinned by construction, and the whole
      # transitive set is now pinned by `uv sync --frozen` — this replaces the
      # earlier bare `pip install -e ".[dev]"` that Scorecard flagged as
      # Pinned-Dependencies, without adding a duplicate hash-locked file.
      #
      # No fallback here: a broken `[dev]` extra must fail loudly, not let
      # pylint run against a partial install and report import errors as code
      # smells instead of as the dependency failure it is.
      run: uv sync --frozen --extra dev

    - name: Install pylint
      # Hash-locked (see .github/pylint-requirements.in/.lock, regenerate with
      # scripts/gen_hash_lock.py). Keeps this every-push job from silently
      # picking up a pylint whose defaults move the --fail-under scores below.
      # Installed into the same venv `uv sync` populated so `uv run pylint`
      # resolves it.
      run: |
        uv pip install --disable-pip-version-check \
          --require-hashes -r .github/pylint-requirements.lock

    - name: Analysing the code with pylint
      run: |
        # Monorepo: lint only the core sakthai-agent package (canonical copy at
        # personas/sakthai/sakthai) + its tests. Other co-located trees (infra/*,
        # the other personas' package copies) carry their own quality bars and
        # are not held to this repo's pylint thresholds.
        uv run pylint --fail-under=7.0 $(git ls-files | grep -E '^(personas/sakthai/sakthai|tests|scripts)/.*\.py$')
        uv run pylint personas/sakthai/sakthai --disable=R0801,R0401 --fail-under=9.0
