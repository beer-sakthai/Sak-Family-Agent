# Reusable PR Container Deployment Workflow
# Deploys pull requests to isolated Docker container environments and tracks preview deployment statuses

name: Reusable PR Deploy

on:
  workflow_call:
    inputs:
      docker_context:
        description: 'Directory path containing the Dockerfile'
        required: false
        default: '.'
        type: string
      server_port:
        description: 'Deployment port'
        required: false
        default: '3000'
        type: string
      action:
        description: 'Deployment action: "deploy" or "teardown"'
        required: false
        default: 'deploy'
        type: string
      preview_url:
        description: 'Custom preview URL (defaults to PR preview domain pattern)'
        required: false
        default: ''
        type: string
    secrets:
      SERVER_HOST:
        required: false
      SERVER_USERNAME:
        required: false
      SERVER_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: pr-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: inputs.action != 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PR Preview Deployment
        uses: maxgfr/github-multi-deployments@ed720d528c8e44c33cca444d1b5375a866ec724c # v1.8.11
        id: pr-deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: pr-${{ github.event.number || github.run_id }}
          auto_inactive: 'true'
          transient_environment: 'true'
          desc: "PR #${{ github.event.number || github.run_id }} preview container"
          payload: '{"pr": ${{ github.event.number || 0 }}}'

      - name: Deploy Pull Request Container
        uses: hngprojects/pr-deploy@2f8b3e0dce07f0c6f7e6e80018dc52081a61b63b # V2.0.1
        with:
          context: ${{ inputs.docker_context }}
          server_port: ${{ inputs.server_port }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

      - name: Finalize PR Preview Deployment
        uses: maxgfr/github-multi-deployments@ed720d528c8e44c33cca444d1b5375a866ec724c # v1.8.11
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.pr-deployment.outputs.deployment_id }}
          env_url: ${{ inputs.preview_url || format('https://pr-{0}.preview.houseofsak.app', github.event.number || github.run_id) }}

  teardown:
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Deactivate PR Preview Environment
        uses: maxgfr/github-multi-deployments@ed720d528c8e44c33cca444d1b5375a866ec724c # v1.8.11
        with:
          step: deactivate-env
          token: ${{ secrets.GITHUB_TOKEN }}
          env: pr-${{ github.event.number || github.run_id }}
