# Runs the test suites that live outside the main `tests/` tree.
#
# `pyproject.toml` sets `testpaths = ["tests"]` and ci.yml points pytest at
# `tests/`, so the suites committed under `apps/` and `services/` were executed
# by no workflow at all. Tests that never run are worse than no tests: they
# still read as coverage to anyone browsing the repo, while silently rotting.
#
# Each job is path-filtered so it only runs when its own subproject changes.
# These are separate builds with disjoint dependency sets (see the monorepo note
# in pyproject.toml) — neither is a uv workspace member, so each is installed on
# its own rather than through the root lockfile.
name: Subproject tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/agent_workflow_framework/**"
      - "apps/sak_agent_dashboard/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/agent_workflow_framework/**"
      - "apps/sak_agent_dashboard/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"

permissions:
  contents: read

jobs:
  agent-workflow-framework:
    name: agent_workflow_framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent_workflow_framework
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pipx install uv

      # The subproject has no pyproject.toml — `agent_workflow/` is a plain
      # package directory imported from the repo. Run it in place with its one
      # runtime dependency supplied by `uv run --with`.
      - name: Run tests
        run: uv run --with pyyaml python -m pytest tests/ -q

  teams-copilot-mcp:
    name: teams-copilot-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/teams-copilot-mcp
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pipx install uv

      # This subproject has its own pyproject.toml and uv.lock (fastmcp / msal /
      # httpx), deliberately kept out of the root lock.
      - name: Run tests
        run: uv run --project . --extra dev python -m pytest tests/ -q

  sak-agent-dashboard:
    name: sak_agent_dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sak_agent_dashboard
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The only Node subproject in the repo. The pnpm version is pinned by
      # `packageManager: pnpm@9.15.9` in the app's package.json, so CI resolves
      # the same tree the committed pnpm-lock.yaml was generated with.
      #
      # `package_json_file` is required, not cosmetic: `defaults.run.working-directory`
      # applies only to `run:` steps, so this action looks in the *repository
      # root* by default — and this repo has no root package.json at all, being
      # a Python monorepo. Without the path the action finds no version source
      # and the job dies before installing anything.
      #
      # Deliberately no `version:` input alongside it: supplying both makes
      # action-setup fail with "Multiple versions of pnpm specified".
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          package_json_file: apps/sak_agent_dashboard/package.json

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/sak_agent_dashboard/pnpm-lock.yaml

      # `--frozen-lockfile` is pnpm's `npm ci`: it installs the locked tree and
      # fails rather than re-resolving, which is what keeps this off the
      # unpinned-dependency findings. Do not add `--no-optional` — better-sqlite3
      # is an optionalDependency precisely so a runner without a native build
      # still passes, and the lockfile expects it to be considered.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
