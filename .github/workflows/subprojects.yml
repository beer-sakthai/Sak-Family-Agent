# Runs the test suites of the two self-contained Python sub-projects that
# ci.yml does not cover: sakthai-chat-cli/ and services/teams-copilot-mcp/.
#
# Each has its own pyproject.toml and uv.lock, and until this workflow no job
# ran either suite, so failures accumulated unnoticed (7 guardrail-assertion
# failures and a collection error in chat-cli, fixed in #1458). Each job
# installs strictly from its own lockfile (`uv sync --frozen`), so the pins are
# exactly what the lock says and a pyproject/lock mismatch fails the job.
#
# Path-filtered so this stays off every change that touches neither tree.
name: Sub-project tests

on:
  push:
    branches: [main]
    paths:
      - "sakthai-chat-cli/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"
  pull_request:
    paths:
      - "sakthai-chat-cli/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"

permissions:
  contents: read

concurrency:
  group: subprojects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-cli:
    name: sakthai-chat-cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sakthai-chat-cli
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest

  teams-copilot-mcp:
    name: teams-copilot-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/teams-copilot-mcp
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest
