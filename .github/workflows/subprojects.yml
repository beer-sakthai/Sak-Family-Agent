# Runs the test suites that live outside the main `tests/` tree.
#
# `pyproject.toml` sets `testpaths = ["tests"]` and ci.yml points pytest at
# `tests/`, so the suites committed under `apps/` and `services/` were executed
# by no workflow at all. Tests that never run are worse than no tests: they
# still read as coverage to anyone browsing the repo, while silently rotting.
#
# Each job is path-filtered so it only runs when its own subproject changes.
# These are separate builds with disjoint dependency sets (see the monorepo note
# in pyproject.toml) — neither is a uv workspace member, so each is installed on
# its own rather than through the root lockfile.
name: Subproject tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/agent_workflow_framework/**"
      - "apps/sak_agent_dashboard/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/agent_workflow_framework/**"
      - "apps/sak_agent_dashboard/**"
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"

permissions:
  contents: read

concurrency:
  # See the note in ci.yml: cancel superseded pull-request runs, never a run on
  # `main`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-workflow-framework:
    name: agent_workflow_framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent_workflow_framework
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # This subproject declares no dependency file at all, so there is nothing
      # for the action's default `cache-dependency-glob` to key on that has any
      # bearing on it — keying on the root lock would tie this job's cache to a
      # tree it never installs. Key it on this workflow file instead: the `--with
      # pyyaml` below *is* the dependency declaration, and it lives here, so the
      # cache is invalidated exactly when the dependency set changes.
      - name: Install uv
        uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/subprojects.yml
          cache-suffix: agent-workflow-framework

      # The subproject has no pyproject.toml — `agent_workflow/` is a plain
      # package directory imported from the repo. Run it in place with its one
      # runtime dependency supplied by `uv run --with`.
      - name: Run tests
        run: uv run --with pyyaml python -m pytest tests/ -q

  teams-copilot-mcp:
    name: teams-copilot-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/teams-copilot-mcp
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Keyed on this subproject's own lock, not the root one. `uses:` steps
      # ignore `defaults.run.working-directory`, so the glob is written relative
      # to the repository root.
      - name: Install uv
        uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            services/teams-copilot-mcp/pyproject.toml
            services/teams-copilot-mcp/uv.lock
          cache-suffix: teams-copilot-mcp

      # This subproject has its own pyproject.toml and uv.lock (fastmcp / msal /
      # httpx), deliberately kept out of the root lock.
      - name: Run tests
        run: uv run --project . --extra dev python -m pytest tests/ -q

  sak-agent-dashboard:
    name: sak_agent_dashboard
    runs-on: ubuntu-latest
    # The longest of the three: pnpm install -> lint -> typecheck -> 172 vitest
    # tests -> next build.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sak_agent_dashboard
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The only Node subproject in the repo. The pnpm version is pinned by
      # `packageManager: pnpm@9.15.9` in the app's package.json, so CI resolves
      # the same tree the committed pnpm-lock.yaml was generated with.
      #
      # `package_json_file` is required, not cosmetic: `defaults.run.working-directory`
      # applies only to `run:` steps, so this action looks in the *repository
      # root* by default — and this repo has no root package.json at all, being
      # a Python monorepo. Without the path the action finds no version source
      # and the job dies before installing anything.
      #
      # Deliberately no `version:` input alongside it: supplying both makes
      # action-setup fail with "Multiple versions of pnpm specified".
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/sak_agent_dashboard/package.json

      # Node 22, not 20: the locked tree needs it. jsdom@30 declares
      # `engines.node: ^22.22.2 || ^24.15.0 || >=26.0.0` and pulls undici@8,
      # which declares `>=22.19.0`. On Node 20 every vitest worker dies at
      # startup with `TypeError: webidl.util.markAsUncloneable is not a
      # function` (undici's CacheStorage, reached from jsdom's api.js) before a
      # single test runs. Keep this at or above jsdom's floor when either dep
      # is upgraded — `engines.node` in the app's package.json tracks the same
      # floor.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sak_agent_dashboard/pnpm-lock.yaml

      # `--frozen-lockfile` is pnpm's `npm ci`: it installs the locked tree and
      # fails rather than re-resolving, which is what keeps this off the
      # unpinned-dependency findings. Do not add `--no-optional` — better-sqlite3
      # is an optionalDependency precisely so a runner without a native build
      # still passes, and the lockfile expects it to be considered.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pnpm *store* is already cached by `setup-node` above; this caches
      # the other half — Next.js's own build cache, which is what lets `next
      # build` reuse compiled modules instead of recompiling the app from
      # scratch on every run. It is the last and longest step of this job.
      #
      # Two-part key: the lockfile pins the toolchain, the source hash pins the
      # input. An exact hit skips recompilation entirely; a source-only change
      # falls back through `restore-keys` to the previous build's cache, which
      # is where the incremental win comes from. `.next/cache` only — not
      # `.next/`, which holds the build *output* and must be produced fresh.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/sak_agent_dashboard/.next/cache
          # `src/**` rather than a brace-expanded extension list:
          # `hashFiles` runs on @actions/glob, which supports `*`, `**`, `?`,
          # `[]` and `!` but not `{a,b}`. A brace pattern there does not error —
          # it just matches nothing, and every run would compute the same
          # constant hash for a source tree that had changed.
          key: >-
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/sak_agent_dashboard/pnpm-lock.yaml') }}-${{
            hashFiles('apps/sak_agent_dashboard/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/sak_agent_dashboard/pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
