# Runs the test suite of the self-contained Python sub-project that
# ci.yml does not cover: services/teams-copilot-mcp/.
#
# It has its own pyproject.toml and uv.lock, and until this workflow no job
# ran its suite. It installs strictly from its own lockfile (`uv sync --locked`),
# so the pins are exactly what the lock says and a pyproject/lock mismatch fails the job.
#
# Path-filtered so this stays off every change that touches neither tree.
name: Sub-project tests

on:
  push:
    branches: [main]
    paths:
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"
  pull_request:
    paths:
      - "services/teams-copilot-mcp/**"
      - ".github/workflows/subprojects.yml"

permissions:
  contents: read

concurrency:
  group: subprojects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teams-copilot-mcp:
    name: teams-copilot-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/teams-copilot-mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "services/teams-copilot-mcp/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run --locked pytest
