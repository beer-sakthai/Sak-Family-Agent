# Synchronize branch workflow (e.g. main -> staging, develop)
# Utilizes connor-baer/action-sync-branch for automated fast-forward or catch-up PRs

name: Branch Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to synchronize with base'
        required: true
        default: 'staging'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-sync-${{ inputs.target_branch }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Target Branch
        id: check_branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch '$TARGET_BRANCH' does not exist on remote. Skipping synchronization."
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize Branch
        if: steps.check_branch.outputs.branch_exists == 'true'
        uses: connor-baer/action-sync-branch@f5d20b6a6944c70909c187b558313dfc1d8daa48 # v2
        with:
          branch: ${{ inputs.target_branch }}
          token: ${{ github.token }}
          force: false
