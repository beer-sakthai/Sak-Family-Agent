name: Gemini AI Code Reviewer

on:
  # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gemini-code-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/gemini-review')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: PR Info
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Comment: $COMMENT_BODY"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR Details
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          echo "head_sha=$(echo "$PR_JSON" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(echo "$PR_JSON" | jq -r .base.sha)" >> "$GITHUB_OUTPUT"
          REVIEWABLE_COUNT=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            | grep -vE '(\.md$|\.txt$|(^|/)package-lock\.json$|\.lock$|\.lock\.yml$)' \
            | wc -l | tr -d ' ')
          if [ "${REVIEWABLE_COUNT}" -gt 0 ]; then
            echo "has_reviewable_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "Info: All changed files in PR #${PR_NUMBER} match excluded patterns; skipping Gemini review."
            echo "has_reviewable_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini AI Code Reviewer
        if: steps.pr.outputs.has_reviewable_files == 'true'
        uses: truongnh1992/gemini-ai-code-reviewer@f9ab8e6b6ec8507aff632c159b5b8c0a771be215 # main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash # Optional, default is `gemini-3.8-flash`
          EXCLUDE: "*.md,*.txt,package-lock.json,*.lock,*.lock.yml"
