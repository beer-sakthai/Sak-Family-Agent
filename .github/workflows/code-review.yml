name: Gemini AI Code Reviewer

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: gemini-code-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gemini-code-review:
    name: Gemini AI Code Review
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/gemini-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: PR information
        shell: bash
        run: |
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR details
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"

          HEAD_SHA="$(jq -r '.head.sha' <<< "${PR_JSON}")"
          BASE_SHA="$(jq -r '.base.sha' <<< "${PR_JSON}")"

          if [[ -z "${HEAD_SHA}" || "${HEAD_SHA}" == "null" ]]; then
            echo "Unable to determine PR head SHA."
            exit 1
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "null" ]]; then
            echo "Unable to determine PR base SHA."
            exit 1
          fi

          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Run Gemini AI code review
        uses: truongnh1992/gemini-ai-code-reviewer@f9ab8e6b6ec8507aff632c159b5b8c0a771be215 # main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          EXCLUDE: "*.md,*.txt,package-lock.json,*.yml,*.yaml"
