# Reusable Deployment Workflow
# Creates a GitHub Deployment and records environment state

name: Reusable Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (e.g. production, staging)'
        required: true
        type: string
      environment_url:
        description: 'URL of the deployed environment'
        required: false
        default: 'https://houseofsak.vercel.app'
        type: string
    outputs:
      deployment_id:
        description: 'The unique ID of the created GitHub Deployment'
        value: ${{ jobs.deploy-record.outputs.deployment_id }}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deployment-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Create Deployment Record
        uses: chrnorm/deployment-action@55729fcebec3d284f60f5bcabbd8376437d696b1 # v2.0.7
        id: deployment
        with:
          token: ${{ github.token }}
          environment: ${{ inputs.environment }}
          environment-url: ${{ inputs.environment_url }}
