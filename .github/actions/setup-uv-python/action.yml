# Set up Python + uv with a warm dependency cache.
#
# WHY THIS EXISTS
#
# Five workflows installed uv and synced the same lockfile five different ways.
# `ci.yml` and `subprojects.yml` ran `pipx install uv` — an unpinned install of
# whatever uv released that morning, and Scorecard's `PinnedDependenciesID`
# reads it exactly that way. `pylint.yml` and `dependency-audit.yml` already
# used the pinned `setup-uv` action, but neither turned its cache on, so every
# job re-downloaded and re-built the full locked closure (~160 packages,
# including the `dev` extra's hypothesis and the whole test toolchain) from
# PyPI. Nothing in this repository cached a single Python wheel.
#
# One action, one place to change the pin, and the cache on by default.
#
# WHAT MAKES THE CACHE CORRECT
#
# `cache-dependency-glob` is the invalidation key. It is `uv.lock` and
# `pyproject.toml` — the two files that can change what gets installed. A hit
# restores uv's global cache (built wheels + the HTTP cache), and
# `uv sync --locked` then resolves from it without touching the network for
# anything already present.
#
# `cache-suffix` partitions the cache. GitHub scopes caches by key, and a key
# that ignores the interpreter would let a 3.11 leg restore a 3.12 leg's
# wheels — the abi3/cp3xx wheels in the closure are not interchangeable. The
# default suffix is the Python version for that reason; callers that install a
# *different dependency set* from the same lockfile (a `--group` the others do
# not take) should pass their own so they do not thrash a shared entry.
name: "Set up Python and uv"
description: >-
  Install a pinned uv, select a Python version, restore uv's dependency cache,
  and optionally run a locked sync. The one Python bootstrap for this repo's
  workflows.

inputs:
  python-version:
    description: "Python version for uv to provision (e.g. 3.11, 3.12)."
    required: false
    default: "3.11"
  sync:
    description: >-
      Run `uv sync` after install. Set to "false" for jobs that only need the
      uv binary (`uv export`, `uvx <tool>`) and never build the project env.
    required: false
    default: "true"
  sync-args:
    description: >-
      Arguments for `uv sync`. Keep `--locked` unless you have a reason not to:
      it installs exactly what uv.lock records and fails on drift, where a bare
      `uv sync` silently re-resolves and puts an unpinned install back in.
    required: false
    default: "--locked --all-extras"
  cache-suffix:
    description: >-
      Extra cache-key partition. Defaults to the Python version so the 3.11 and
      3.12 legs never restore each other's wheels.
    required: false
    default: ""
  working-directory:
    description: "Directory to run the sync in. Defaults to the repository root."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install uv (pinned) and restore its cache
      uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: |
          **/uv.lock
          **/pyproject.toml
        cache-suffix: ${{ inputs.cache-suffix != '' && inputs.cache-suffix || format('py{0}', inputs.python-version) }}

    - name: Install dependencies
      if: inputs.sync == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.sync-args }}
