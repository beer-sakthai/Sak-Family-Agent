# Git Conflict Resolver Configuration
# This file defines rules for automatically resolving Git conflicts

rules:
  # Always use theirs for dependency lock files
  - paths: 'package-lock.json'
    strategy: 'theirs'

  - paths: 'yarn.lock'
    strategy: 'theirs'

  # Always use ours for auto-generated files
  - paths: '*.generated.ts'
    strategy: 'ours'

  - paths: '*.generated.js'
    strategy: 'ours'

  # For build output directories, always use ours
  - paths: 'dist/**/*'
    strategy: 'ours'

  - paths: 'build/**/*'
    strategy: 'ours'

  # Dashboard tests: accept incoming if both modified
  - paths: 'apps/sak_agent_dashboard/**/*.test.tsx'
    conflict_type: 'both-modified'
    strategy: 'theirs'

  # Core Python tests: accept incoming if both modified
  - paths: 'tests/**/*.py'
    conflict_type: 'both-modified'
    strategy: 'theirs'

  # Documentation: when added by both sides, prefer incoming
  - paths: 'docs/**/*.md'
    conflict_type: 'both-added'
    strategy: 'theirs'
