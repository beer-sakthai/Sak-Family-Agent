# Dependabot keeps dependencies and pinned action versions current.
# Four ecosystems live in this repo: Python (uv), the npm projects, the GitHub
# Actions used by the workflows, and the Docker base images. Everything here is
# pinned by SHA/digest for OpenSSF Scorecard's Pinned-Dependencies check, so
# Dependabot is what keeps those pins from going stale.
version: 2
updates:
  # Python dependencies — pyproject.toml + uv.lock at the repo root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Let a newly published version age for a week before proposing it. The
    # attack this defends against is a maintainer-account compromise that
    # publishes a malicious release: those are typically caught and yanked
    # within days, and a cooldown means Dependabot never opens the PR that
    # would otherwise walk it straight into the lockfile. Dependabot exempts
    # security updates from cooldown, so real advisories still arrive at once.
    cooldown:
      default-days: 7
    # setuptools appears in pyproject.toml only under
    # `[build-system] requires = ["setuptools>=83.0.0", "wheel"]`, never in
    # `[project] dependencies`. Dependabot's uv FileUpdater does not write
    # `[build-system] requires`, so every attempt produces no file change and
    # the whole job dies:
    #
    #     Updating setuptools from 83.0.0 to 84.0.0
    #     ERROR Error processing setuptools (RuntimeError)
    #     ERROR No files have changed!
    #           /home/dependabot/uv/lib/dependabot/uv/file_updater.rb:26
    #
    # There is nothing here for Dependabot to keep current anyway: that line is
    # a floor (`>=`), not a pin, and the build backend is resolved at build time
    # rather than from uv.lock. Bumping the floor by hand would not stop this
    # recurring on the next setuptools release.
    ignore:
      - dependency-name: "setuptools"
      # google-genai>=2.16.0 caps tenacity at <9.2.0; ignore >=9.2.0 until
      # google-genai lifts that upper bound so Dependabot uv resolution succeeds.
      - dependency-name: "tenacity"
        versions: [">= 9.2.0"]
      # launchdarkly-observability pins opentelemetry-api to 1.34.1; ignore > 1.34.1 until
      # launchdarkly updates its pinned opentelemetry dependency.
      - dependency-name: "opentelemetry-api"
        versions: ["> 1.34.1"]
      # launchdarkly-ai-claude-messages caps anthropic at <2; ignore >= 2.0.0 until
      # launchdarkly updates its anthropic SDK support.
      - dependency-name: "anthropic"
        versions: [">= 2.0.0"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Playwright accessibility probe — the only npm project with real
  # dependencies (the old /dashboard tree no longer exists).
  - package-ecosystem: "npm"
    directory: "/infra/pw-poc"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Pinned action versions in .github/workflows/.
  # Scoped to core security/CI action namespaces without a catch-all `*` group:
  # grouping 115+ actions across 120+ workflows into a single wildcard group
  # triggers O(N^2) workflow re-parsing inside Dependabot's GroupUpdateCreation
  # and hits the 45-minute job timeout.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "actions/*"
      - dependency-name: "github/*"
      - dependency-name: "step-security/*"
      - dependency-name: "astral-sh/*"
      - dependency-name: "ossf/*"
      - dependency-name: "PyCQA/*"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: npm
    directory: /apps/sak_agent_dashboard
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      # The dashboard is written against Tailwind v3: globals.css uses the v3
      # `@tailwind base/components/utilities` directives and tailwind.config.ts
      # is a v3 JS config. A v4 major needs the PostCSS plugin move to
      # `@tailwindcss/postcss` plus a directive/config migration, none of which
      # has been done. The v4 bump has landed and broken the Vercel build twice
      # already (reverted once in b330e2f, re-proposed as 23745ae) — hold the
      # major until someone does the migration deliberately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Same story, different package. TypeScript 7 is incompatible with the
      # typescript-eslint that eslint-config-next@16 pins (`typescript-eslint
      # does not support TS 7.0.` — it declares `typescript@>=4.8.4 <6.1.0`),
      # so a TS 7 major turns `npm run lint` into a hard crash and apps.yml red.
      # This has already happened twice: 6f61479 pinned TypeScript back once,
      # but added no ignore here, so Dependabot proposed 7.0.2 again and #1396
      # merged it. The pin alone is not the fix — this entry is.
      # Lift both together once eslint-config-next ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dashboard-minor-patch:
        update-types: ["minor", "patch"]

  # The two stitch skill trees. Both carry an explicit PR limit and grouping:
  # without them each entry defaults to 5 ungrouped PRs, so these two alone
  # could open 10 a day and bury everything else in the queue.
  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch-react-components
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      stitch-react-components:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch-react-native
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      stitch-react-native:
        update-types: ["minor", "patch"]

  # Docker base images. Every Dockerfile pins its base by digest, which only
  # stays current if something bumps it — that something is this.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/sakthai-training-space
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/servicequotebot/docker
    schedule:
      interval: daily
    open-pull-requests-limit: 5
