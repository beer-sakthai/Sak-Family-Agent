# Dependabot keeps dependencies and pinned action versions current.
# Four ecosystems live in this repo: Python (uv), the npm projects, the GitHub
# Actions used by the workflows, and the Docker base images. Everything here is
# pinned by SHA/digest for OpenSSF Scorecard's Pinned-Dependencies check, so
# Dependabot is what keeps those pins from going stale.
version: 2
updates:
  # Python dependencies — pyproject.toml + uv.lock at the repo root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Let a newly published version age for a week before proposing it. The
    # attack this defends against is a maintainer-account compromise that
    # publishes a malicious release: those are typically caught and yanked
    # within days, and a cooldown means Dependabot never opens the PR that
    # would otherwise walk it straight into the lockfile. Dependabot exempts
    # security updates from cooldown, so real advisories still arrive at once.
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Playwright accessibility probe — the only npm project with real
  # dependencies (the old /dashboard tree no longer exists).
  - package-ecosystem: "npm"
    directory: "/infra/pw-poc"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Pinned action versions in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Same cooldown reasoning as the uv ecosystem above, and it matters most
    # here: a workflow `uses:` runs with the job's token, so a compromised
    # third-party action release is the highest-value supply-chain target in
    # the repo. First-party `actions/*` are exempt — they are the ones whose
    # security fixes we want immediately.
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/sak_agent_dashboard
    schedule:
      interval: daily
    ignore:
      # The dashboard is written against Tailwind v3: globals.css uses the v3
      # `@tailwind base/components/utilities` directives and tailwind.config.ts
      # is a v3 JS config. A v4 major needs the PostCSS plugin move to
      # `@tailwindcss/postcss` plus a directive/config migration, none of which
      # has been done. The v4 bump has landed and broken the Vercel build twice
      # already (reverted once in b330e2f, re-proposed as 23745ae) — hold the
      # major until someone does the migration deliberately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # The two stitch skill trees. Both carry an explicit PR limit and grouping:
  # without them each entry defaults to 5 ungrouped PRs, so these two alone
  # could open 10 a day and bury everything else in the queue.
  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch::react-components
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      stitch-react-components:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch::react-native
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      stitch-react-native:
        update-types: ["minor", "patch"]

  # Docker base images. Both Dockerfiles pin their base by digest, which only
  # stays current if something bumps it — that something is this.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/sakthai-training-space
    schedule:
      interval: weekly
