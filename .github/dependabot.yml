version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/" 
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/" 
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    target-branch: "main"

  - package-ecosystem: "github-actions"
    directory: "/" 
    schedule:
      interval: "daily"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    target-branch: "main"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /apps/sak_agent_dashboard
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /infra/pw-poc
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /infra/sakthai-training-space
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /personas/sakking/skills/SakKing-agent-platform-skill-registry/scripts
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /personas/sakking/skills/SakKing-agent-platform-tuning/references
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch::react-components
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /personas/saksee/skills/SakSee-stitch::react-native
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /personas/sakthai/sakthai/telegram
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /personas/sakthai/skills/SakThai-hf-cloud-python-env-setup
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /personas/shared/sakthai/telegram
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /sakthai-chat-cli/sakthai/telegram
    schedule:
      interval: daily
