# Dependabot configuration for Sak-Family-Agent.
#
# Dependency ecosystem types:
# - Python (uv)
# - npm
# - GitHub Actions
# - Docker
#
# Routine version updates use scheduled checks and controlled grouping.
# Security updates are kept on a separate track so vulnerability fixes can
# be proposed without being delayed by the version-update cooldown.
#
# IMPORTANT:
# Dependabot Alerts and Dependabot Security Updates must also be enabled in:
# Repository Settings -> Security and analysis / Advanced Security.
#
# Dependencies, GitHub Actions and container images are pinned where
# practical to support supply-chain integrity and OpenSSF Scorecard checks.

version: 2

updates:

  # ============================================================
  # PYTHON / UV
  # ============================================================
  # pyproject.toml + uv.lock at repository root.

  - package-ecosystem: "uv"
    directory: "/"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    # Routine version updates must age for 7 days.
    # Security updates are not delayed by this cooldown.
    cooldown:
      default-days: 7

    # setuptools is only used as a build-system minimum:
    #
    # [build-system]
    # requires = ["setuptools>=83.0.0", "wheel"]
    #
    # It is not a normal project dependency pin, and attempting to update it
    # through the uv updater can result in no dependency file change.
    ignore:
      - dependency-name: "setuptools"

    groups:

      # Routine minor/patch dependency updates.
      python-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

      # Security fixes remain separate from routine dependency maintenance.
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # PLAYWRIGHT ACCESSIBILITY PROBE
  # ============================================================

  - package-ecosystem: "npm"
    directory: "/infra/pw-poc"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    groups:

      npm-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # GITHUB ACTIONS
  # ============================================================
  # Actions referenced from .github/workflows/.

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    # Third-party action releases must age for 7 days before routine
    # Dependabot version-update PRs are proposed.
    #
    # Official actions/* dependencies are excluded from that cooldown.
    # Security updates are not delayed by the version-update cooldown.
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"

    groups:

      actions:
        applies-to: "version-updates"
        patterns:
          - "*"

      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # SAK AGENT DASHBOARD
  # ============================================================

  - package-ecosystem: "npm"
    directory: "/apps/sak_agent_dashboard"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    ignore:

      # Dashboard currently targets Tailwind CSS v3.
      # Block routine v4 major upgrades until the dashboard is deliberately
      # migrated to Tailwind CSS v4.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"

      # Block routine TypeScript major upgrades until the dashboard's
      # ESLint/typescript-eslint dependency chain supports the new major.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

    groups:

      dashboard-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

      dashboard-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # SAKSEE STITCH REACT COMPONENTS
  # ============================================================

  - package-ecosystem: "npm"
    directory: "/personas/saksee/skills/SakSee-stitch-react-components"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 3

    groups:

      stitch-react-components:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

      stitch-react-components-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # SAKSEE STITCH REACT NATIVE
  # ============================================================

  - package-ecosystem: "npm"
    directory: "/personas/saksee/skills/SakSee-stitch-react-native"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 3

    groups:

      stitch-react-native:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

      stitch-react-native-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # ROOT DOCKER IMAGES
  # ============================================================

  - package-ecosystem: "docker"
    directory: "/"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    groups:

      root-docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # SAKTHAI TRAINING SPACE DOCKER IMAGES
  # ============================================================

  - package-ecosystem: "docker"
    directory: "/infra/sakthai-training-space"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    groups:

      sakthai-docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"


  # ============================================================
  # SERVICEQUOTEBOT DOCKER IMAGES
  # ============================================================

  - package-ecosystem: "docker"
    directory: "/infra/servicequotebot/docker"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 5

    groups:

      servicequotebot-docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
