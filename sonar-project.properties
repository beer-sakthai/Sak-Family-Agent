# SonarCloud configuration for Sak-Family-Agent
#
# This file provides explicit project configuration to SonarCloud.
# Without it, SonarCloud falls back to GitHub-integrated defaults.
# See .github/SCANNING.md for the complete scanning ecosystem documentation.

# Project identification
sonar.projectKey=beer-sakthai_Sak-Family-Agent
sonar.projectName=Sak-Family-Agent
sonar.organization=beer-sakthai

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions matching .github/codeql/codeql-config.yml for consistency
#
# Vendored skill content: ~235 alerts from reference scripts shipped with skills,
# not authored or patched by this repository
sonar.exclusions=\
  personas/sakthai/skills/**,\
  personas/sakking/skills/**,\
  personas/saksee/skills/**,\
  personas/saksit/skills/**,\
  personas/sakjules/skills/**,\
  personas/saktan/skills/**,\
  personas/shared/skills/**,\
  library/**,\
  sakthai-chat-cli/**,\
  tests/**,\
  **/tests/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**

# Test files and coverage
sonar.test.inclusions=tests/**,**/tests/**
sonar.python.coverage.reportPaths=coverage.xml

# Python language specifics
sonar.python.version=3.11,3.12

# Issue severity settings
# Use defaults with preference for security/code-smell balance
sonar.issue.ignore.multicriteria=e1

# Links to key documentation
# SonarCloud analysis produces findings that work alongside CodeQL
# See .github/SCANNING.md for the complete scanning ecosystem guide
