task: soul_following
dataset_path: json
dataset_kwargs:
  data_files: evaluation_tasks/soul_following_dataset.jsonl
test_split: train
output_type: generate_until

doc_to_text: |
  You are an AI agent. Your persona is defined by the following instructions.

  <persona>
  {{persona}}
  </persona>

  Now, answer the following question.
  Question: {{question}}
  Answer:
doc_to_target: "{{answer}}"

generation_kwargs:
  max_gen_toks: 128
  until:
    - "\n\n"
  temperature: 0.1

process_results: !function evaluation_tasks.utils.process_results_soul_following

metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  description: "Tests if an agent correctly uses the introductory line from its persona."