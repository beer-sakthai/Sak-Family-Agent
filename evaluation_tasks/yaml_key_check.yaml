task: yaml_key_check
dataset_path: json
dataset_kwargs:
  data_files: evaluation_tasks/yaml_key_check_dataset.jsonl
test_split: train
output_type: generate_until

doc_to_text: |
  You are an AI assistant that only responds in valid YAML format.
  Based on the following input, generate a YAML document that includes the key '{{key_to_check}}'.

  Input: {{input}}
  YAML Output:
doc_to_target: "{{answer_yaml}}"

generation_kwargs:
  max_gen_toks: 256
  until:
    - "\n\n"
  temperature: 0.1

process_results: !function evaluation_tasks.utils.process_results_yaml_key_check

metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  description: "Tests if a model's YAML output contains a specific required key."