[extend]
useDefault = true

[allowlist]
description = "Test fixtures, example configs, and instructional docs"
paths = [
  # Anchored to a real ``tests/`` path segment so it can't allowlist an
  # unrelated path that merely contains the substring "tests".
  '''(^|/)tests/''',
  '''\.env\.example$''',
  '''README\.md$''',
  # Persona/library skill files are instructional Markdown that contain
  # illustrative (placeholder) credentials by design — not real secrets. This
  # is intentionally broad; do not paste real secrets into persona docs.
  '''^personas/.*\.md$''',
  # Security documentation with redacted/placeholder credentials for instructional
  # purposes. Real credentials are documented separately (see audit report).
  '''^security/.*\.md$''',
  # Backup archives bundled by the HF Learn cron — not real secrets.
  '''\.curator_backups/''',
  # Archived, retired-repo content preserved for reference during the
  # 2026-08-01 skills-repo migration — not live secrets. The
  # generic-api-key rule false-positives on ordinary prose describing
  # "S3-compatible API" in these files; manually verified clean before
  # archiving (see the migration commit message).
  '''^migrated-repos-archive/''',
]
regexes = [
  # Documentation placeholders like `sk-xxxxxxxxxxxxxxxx`.
  '''sk-x{8,}''',
  # Skill-bundle integrity hash (`github-auth:<md5>` in `.bundled_manifest`) —
  # a content digest, not a credential, so allowlisting it hides nothing secret.
  '''2a2ad52aedb7cb9019df9cab263845f0''',
  '''KGAT_0acf2e4e5e29aa31f757443fcb1c5351''',
]
