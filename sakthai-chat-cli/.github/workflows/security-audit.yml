name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # Run daily to catch newly disclosed vulnerabilities
    - cron: "0 2 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit Dependencies

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pip-audit
        run: uv run pip-audit --desc --skip-editable
        continue-on-error: true

      - name: Run bandit
        run: uv run bandit -r sakthai/ --json --output bandit-report.json || true

      - name: Check for critical vulnerabilities
        run: |
          if uv run pip-audit --desc --skip-editable 2>&1 | grep -i "CRITICAL"; then
            echo "::error::Critical vulnerabilities found - please update dependencies"
            exit 1
          fi
