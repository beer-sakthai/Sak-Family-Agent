model:
  provider: ollama
  default: sakthai
providers: {}
approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
command_allowlist: []
security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  # Fail closed: if the Tirith policy engine errors or is missing, block the
  # action rather than allowing it. A security guard that fails open silently
  # disables itself the moment it breaks.
  tirith_fail_open: false
  # Do not install packages on the fly at runtime (arbitrary-code / supply-chain
  # vector). Provision dependencies ahead of time instead.
  allow_lazy_installs: false
