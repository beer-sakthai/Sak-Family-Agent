## Xet Storage Workflow

1. curl API: `GET /api/models/{id}` → sibling entries have `{"rfilename": "..."}` only (no size, no LFS)
2. Even `files_metadata=True` returns null sizes for Xet repos
3. HEAD request to resolve URL:
   - `Content-Length: 1072` ← WRONG (pointer file size)
   - `x-linked-size: 1117320768` ← CORRECT (1.04 GB)
4. Use `x-linked-size` as authoritative real file size

